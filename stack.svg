<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="edgeViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="gridStack" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#12151B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="#050505"/>
  <rect width="1200" height="600" fill="url(#gridStack)"/>
  <circle cx="600" cy="300" r="280" fill="url(#bgGlowA)"/>
  <rect x="0.5" y="0.5" width="1199" height="599" fill="none" stroke="#242832" rx="18"/>

  <text x="60" y="60" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="6" fill="#8B93A1">THE STACK</text>
  <text x="60" y="82" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#4B5262">TECHNOLOGY CONSTELLATION</text>

  <!-- spokes from center to every node -->
  <g stroke="#242832" stroke-width="1">
    <line x1="600" y1="300" x2="600" y2="65"/>
    <line x1="600" y1="300" x2="709" y2="92"/>
    <line x1="600" y1="300" x2="793" y2="167"/>
    <line x1="600" y1="300" x2="833" y2="272"/>
    <line x1="600" y1="300" x2="820" y2="383"/>
    <line x1="600" y1="300" x2="756" y2="476"/>
    <line x1="600" y1="300" x2="656" y2="528"/>
    <line x1="600" y1="300" x2="544" y2="528"/>
    <line x1="600" y1="300" x2="444" y2="476"/>
    <line x1="600" y1="300" x2="380" y2="383"/>
    <line x1="600" y1="300" x2="367" y2="272"/>
    <line x1="600" y1="300" x2="407" y2="167"/>
    <line x1="600" y1="300" x2="491" y2="92"/>
  </g>

  <!-- cluster relationships -->
  <g fill="none" stroke-width="1.4" opacity="0.85">
    <path d="M600 65 L709 92" stroke="url(#edgeBlue)"/>
    <path d="M793 167 L833 272" stroke="url(#edgeBlue)"/>
    <path d="M833 272 L656 528" stroke="url(#edgeBlue)"/>
    <path d="M656 528 L491 92" stroke="url(#edgeBlue)"/>
    <path d="M544 528 L444 476" stroke="url(#edgeViolet)"/>
    <path d="M444 476 L380 383" stroke="url(#edgeViolet)"/>
    <path d="M380 383 L367 272" stroke="url(#edgeViolet)"/>
    <path d="M367 272 L407 167" stroke="url(#edgeViolet)"/>
  </g>

  <!-- center node -->
  <circle cx="600" cy="300" r="46" fill="url(#coreGlow)"/>
  <circle cx="600" cy="300" r="30" fill="#0B0D10" stroke="#3B82F6" stroke-width="2"/>
  <text x="600" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1" fill="#F5F7FA">CHETHAN</text>
  <text x="600" y="311" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="2" fill="#8B93A1">CORE</text>

  <!-- nodes: core stack (larger) -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#F5F7FA">
    <circle cx="600" cy="65" r="8" fill="#3B82F6"/>
    <text x="600" y="45" text-anchor="middle">React</text>

    <circle cx="793" cy="167" r="8" fill="#3B82F6"/>
    <text x="812" y="163" text-anchor="start">Node.js</text>

    <circle cx="656" cy="528" r="8" fill="#22D3EE"/>
    <text x="656" y="552" text-anchor="middle">Gemini</text>

    <circle cx="444" cy="476" r="8" fill="#8B5CF6"/>
    <text x="424" y="500" text-anchor="end">RAG</text>

    <circle cx="380" cy="383" r="8" fill="#8B5CF6"/>
    <text x="360" y="386" text-anchor="end">AI Agents</text>
  </g>

  <!-- nodes: secondary stack (smaller) -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#C9D3E0">
    <circle cx="709" cy="92" r="5.5" fill="#3B82F6" opacity="0.85"/>
    <text x="726" y="88" text-anchor="start">Next.js</text>

    <circle cx="833" cy="272" r="5.5" fill="#3B82F6" opacity="0.85"/>
    <text x="852" y="276" text-anchor="start">FastAPI</text>

    <circle cx="820" cy="383" r="5.5" fill="#3B82F6" opacity="0.7"/>
    <text x="839" y="387" text-anchor="start">PostgreSQL</text>

    <circle cx="756" cy="476" r="5.5" fill="#3B82F6" opacity="0.7"/>
    <text x="774" y="480" text-anchor="start">Redis</text>

    <circle cx="544" cy="528" r="5.5" fill="#22D3EE" opacity="0.8"/>
    <text x="544" y="552" text-anchor="middle">Docker</text>

    <circle cx="367" cy="272" r="5.5" fill="#8B5CF6" opacity="0.85"/>
    <text x="349" y="276" text-anchor="end">MCP</text>

    <circle cx="407" cy="167" r="5.5" fill="#8B5CF6" opacity="0.7"/>
    <text x="389" y="163" text-anchor="end">A2A</text>

    <circle cx="491" cy="92" r="5.5" fill="#3B82F6" opacity="0.6"/>
    <text x="474" y="88" text-anchor="end">Kubernetes</text>
  </g>

  <text x="1140" y="565" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="2" fill="#4B5262">NODE SIZE = CENTRALITY TO CURRENT STACK</text>
</svg>
