<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">CHETHAN.OS — boot sequence</title>
<desc id="d">An animated terminal boot screen that loads Chethan Gowda's engineering profile.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07090f"/><stop offset=".6" stop-color="#0d1117"/><stop offset="1" stop-color="#1a0f1f"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffb547"/><stop offset=".5" stop-color="#ff6b6b"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#ffb547"/>
  </linearGradient>
  <radialGradient id="core">
    <stop offset="0" stop-color="#ffb547"/><stop offset=".45" stop-color="#ff6b6b" stop-opacity=".55"/><stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
  </radialGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity=".025"/>
  </pattern>
  <clipPath id="typeName"><rect x="40" y="290" height="80" width="0">
    <animate attributeName="width" from="0" to="640" begin="3.6s" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"/>
  </rect></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>

<style>
  .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
  .log{font-size:15px;fill:#c9d1d9}
  .ok{fill:#2dd4bf;font-weight:700}
  .warn{fill:#ffb547;font-weight:700}
  .dim{fill:#6e7681}
</style>

<rect width="1200" height="430" rx="20" fill="url(#bg)"/>
<rect width="1200" height="430" rx="20" fill="url(#scan)"/>
<rect x=".5" y=".5" width="1199" height="429" rx="20" fill="none" stroke="#30363d"/>

<!-- window chrome -->
<rect x="0" y="0" width="1200" height="44" rx="20" fill="#161b22"/>
<rect x="0" y="24" width="1200" height="20" fill="#161b22"/>
<line x1="0" y1="44" x2="1200" y2="44" stroke="#30363d"/>
<circle cx="28" cy="22" r="7" fill="#ff5f57"/><circle cx="52" cy="22" r="7" fill="#febc2e"/><circle cx="76" cy="22" r="7" fill="#28c840"/>
<text x="600" y="27" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">chethan@bengaluru: ~ — CHETHAN.OS v4.0 — tty1</text>

<!-- boot log -->
<g class="mono log">
  <text x="48" y="86" opacity="0"><tspan class="dim">[0.0012]</tspan> <tspan class="ok">[  OK  ]</tspan> Mounting /dev/curiosity on /mind
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.15s" fill="freeze"/></text>
  <text x="48" y="113" opacity="0"><tspan class="dim">[0.0420]</tspan> <tspan class="ok">[  OK  ]</tspan> Loading modules: java python javascript typescript
    <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.15s" fill="freeze"/></text>
  <text x="48" y="140" opacity="0"><tspan class="dim">[0.1337]</tspan> <tspan class="ok">[  OK  ]</tspan> Started agent-orchestrator.service
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.15s" fill="freeze"/></text>
  <text x="48" y="167" opacity="0"><tspan class="dim">[0.2048]</tspan> <tspan class="ok">[  OK  ]</tspan> RAG pipeline online · vector store attached
    <animate attributeName="opacity" from="0" to="1" begin="1.65s" dur="0.15s" fill="freeze"/></text>
  <text x="48" y="194" opacity="0"><tspan class="dim">[0.2026]</tspan> <tspan class="ok">[  OK  ]</tspan> Spawned hackathon-mode (pid 2026)
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.15s" fill="freeze"/></text>
  <text x="48" y="221" opacity="0"><tspan class="dim">[0.3141]</tspan> <tspan class="warn">[ WARN ]</tspan> coffee.level &lt; 20% — continuing anyway
    <animate attributeName="opacity" from="0" to="1" begin="2.55s" dur="0.15s" fill="freeze"/></text>
  <text x="48" y="248" opacity="0"><tspan class="dim">[0.4096]</tspan> <tspan class="ok">[  OK  ]</tspan> All systems nominal. Welcome, visitor.
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.15s" fill="freeze"/></text>
</g>

<!-- name (typed in via clip) -->
<g clip-path="url(#typeName)">
  <text x="44" y="345" class="mono" font-size="56" font-weight="800" fill="url(#name)" letter-spacing="1">CHETHAN GOWDA</text>
</g>
<rect x="44" y="302" width="26" height="50" fill="#ffb547" opacity="0">
  <animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.01;.5;.51;.99;1" begin="0s" dur="1s" repeatCount="3"/>
  <animate attributeName="x" from="44" to="468" begin="3.6s" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"/>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.51;1" begin="3.6s" dur="1s" repeatCount="indefinite"/>
</rect>
<text x="46" y="388" class="mono" font-size="17" fill="#8b949e" opacity="0">
  <tspan fill="#2dd4bf">&gt;</tspan> CS Engineer · AI Systems Builder · Full-Stack Developer
  <animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.6s" fill="freeze"/>
</text>

<!-- orbital core -->
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="1.5s" fill="freeze"/>
  <circle cx="960" cy="215" r="90" fill="url(#core)" filter="url(#glow)">
    <animate attributeName="r" values="80;100;80" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="215" r="34" fill="#0d1117" stroke="#ffb547" stroke-width="2"/>
  <text x="960" y="220" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#ffb547">CORE</text>

  <g fill="none" stroke="url(#ring)" stroke-width="1.4">
    <ellipse cx="960" cy="215" rx="88" ry="88" stroke-dasharray="4 8" opacity=".7"/>
    <ellipse cx="960" cy="215" rx="135" ry="135" opacity=".35"/>
    <ellipse cx="960" cy="215" rx="180" ry="180" stroke-dasharray="2 10" opacity=".45"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 960 215" to="360 960 215" dur="9s" repeatCount="indefinite"/>
    <circle cx="1048" cy="215" r="7" fill="#2dd4bf"/>
    <circle cx="872" cy="215" r="4" fill="#ffb547"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 960 215" to="0 960 215" dur="16s" repeatCount="indefinite"/>
    <circle cx="960" cy="80" r="8" fill="#f472b6"/>
    <circle cx="1095" cy="215" r="5" fill="#2dd4bf"/>
    <circle cx="865" cy="310" r="5" fill="#ffb547"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 960 215" to="360 960 215" dur="26s" repeatCount="indefinite"/>
    <circle cx="1140" cy="215" r="6" fill="#ffb547"/>
    <circle cx="780" cy="215" r="4" fill="#f472b6"/>
    <circle cx="960" cy="395" r="5" fill="#2dd4bf"/>
  </g>

  <g class="mono" font-size="11" fill="#6e7681">
    <text x="1080" y="70">agents</text>
    <text x="760" y="70">systems</text>
    <text x="1100" y="375">products</text>
  </g>
</g>

<!-- status bar -->
<text x="1160" y="412" text-anchor="end" class="mono" font-size="12" fill="#6e7681" opacity="0">uptime: always learning · load: ███████████ 100%
  <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.6s" fill="freeze"/>
</text>
</svg>
