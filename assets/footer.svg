<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t">
<title id="t">Session saved — thanks for visiting</title>
<defs>
  <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#ffb547"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
</defs>
<style>.mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}</style>
<rect width="1200" height="150" rx="20" fill="#07090f"/>
<rect x=".5" y=".5" width="1199" height="149" rx="20" fill="none" stroke="#30363d"/>

<path fill="none" stroke="url(#w)" stroke-width="2" opacity=".8"
  d="M0 112 C150 82 300 142 450 112 S750 82 900 112 S1100 142 1200 112">
  <animate attributeName="d" dur="6s" repeatCount="indefinite"
    values="M0 112 C150 82 300 142 450 112 S750 82 900 112 S1100 142 1200 112;
            M0 112 C150 142 300 82 450 112 S750 142 900 112 S1100 82 1200 112;
            M0 112 C150 82 300 142 450 112 S750 82 900 112 S1100 142 1200 112"/>
</path>
<path fill="none" stroke="url(#w)" stroke-width="1" opacity=".35"
  d="M0 122 C200 102 350 142 600 122 S1000 102 1200 122">
  <animate attributeName="d" dur="8s" repeatCount="indefinite"
    values="M0 122 C200 102 350 142 600 122 S1000 102 1200 122;
            M0 122 C200 142 350 102 600 122 S1000 142 1200 122;
            M0 122 C200 102 350 142 600 122 S1000 102 1200 122"/>
</path>

<text x="600" y="58" text-anchor="middle" class="mono" font-size="18" fill="#c9d1d9">
  <tspan fill="#2dd4bf">chethan@bengaluru</tspan><tspan fill="#6e7681">:~$</tspan> echo "thanks for visiting — now go build something"
</text>
<rect x="964" y="44" width="10" height="18" fill="#ffb547">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.51;1" dur="1s" repeatCount="indefinite"/>
</rect>
<text x="600" y="86" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">[ session saved · process will resume on next commit ]</text>
</svg>
