<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Consolas,'Courier New',monospace">
  <defs>
    <radialGradient id="bgVign" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B150D"/>
      <stop offset="55%" stop-color="#050B06"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="spendGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <symbol id="snode" viewBox="-12 -12 24 24">
      <circle r="11" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
      <circle r="5" fill="#00E5FF"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </symbol>
    <symbol id="snodeG" viewBox="-12 -12 24 24">
      <circle r="11" fill="none" stroke="#00FFA3" stroke-width="1" opacity="0.5"/>
      <circle r="5" fill="#00FFA3"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </symbol>
  </defs>

  <rect width="900" height="620" fill="url(#bgVign)"/>
  <g stroke="#00FFA3" stroke-width="0.5" fill="none" opacity="0.07">
    <circle cx="450" cy="300" r="150"/><circle cx="450" cy="300" r="220"/>
  </g>
  <g stroke="#596275" stroke-width="1" opacity="0.35">
    <path d="M25 25 H60 M25 25 V60"/>
    <path d="M875 25 H840 M875 25 V60"/>
  </g>

  <text x="450" y="55" text-anchor="middle" font-size="24" fill="#00FFA3" letter-spacing="5">SPENDWISE</text>
  <text x="450" y="80" text-anchor="middle" font-size="12" fill="#8B96AE" letter-spacing="3">SPECIALIZED ORGAN 04 — PERSONAL FINANCE ANALYTICS</text>

  <!-- organ body -->
  <ellipse cx="450" cy="310" rx="380" ry="230" fill="rgba(0,255,163,0.03)" stroke="#00FFA3" stroke-width="1" stroke-dasharray="3 8" opacity="0.5"/>

  <!-- transaction stream -->
  <g>
    <path d="M120 220 C 260 240 380 260 480 280" fill="none" stroke="url(#spendGrad)" stroke-width="1.5" opacity="0.7"/>
    <path d="M120 260 C 260 280 380 300 480 320" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
    <path d="M120 300 C 260 320 380 340 480 360" fill="none" stroke="url(#spendGrad)" stroke-width="1.2" opacity="0.5"/>
    <g>
      <circle r="2.6" fill="#00FFA3" filter="url(#glowGreen)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M120 220 C 260 240 380 260 480 280"/></circle>
      <circle r="2.2" fill="#00E5FF"><animateMotion dur="2.8s" repeatCount="indefinite" path="M120 260 C 260 280 380 300 480 320"/></circle>
      <circle r="2.4" fill="#00FFA3"><animateMotion dur="3.2s" repeatCount="indefinite" path="M120 300 C 260 320 380 340 480 360"/></circle>
    </g>
    <text x="120" y="200" font-size="11" fill="#8B96AE" letter-spacing="2">TRANSACTIONS</text>
  </g>

  <!-- analytics core -->
  <g>
    <circle cx="560" cy="300" r="70" fill="rgba(0,255,163,0.06)"/>
    <circle cx="560" cy="300" r="52" fill="none" stroke="#00FFA3" stroke-width="1.2"/>
    <circle cx="560" cy="300" r="34" fill="none" stroke="#00FFA3" stroke-width="0.8" stroke-dasharray="3 5">
      <animateTransform attributeName="transform" type="rotate" from="0 560 300" to="360 560 300" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="300" r="10" fill="#00FFA3" filter="url(#glowGreen)">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="560" y="360" text-anchor="middle" font-size="11" fill="#8B96AE" letter-spacing="2">ANALYTICS</text>
  </g>

  <!-- budget nodes -->
  <use href="#snode" x="260" y="400"/><text x="260" y="420" text-anchor="middle" font-size="11" fill="#00E5FF" letter-spacing="1">BUDGET</text>
  <use href="#snode" x="380" y="440"/><text x="380" y="460" text-anchor="middle" font-size="11" fill="#00E5FF" letter-spacing="1">CATEGORY</text>
  <use href="#snodeG" x="640" y="430"/><text x="640" y="450" text-anchor="middle" font-size="11" fill="#00FFA3" letter-spacing="1">SPENDING STREAM</text>
  <use href="#snodeG" x="720" y="380"/><text x="720" y="400" text-anchor="middle" font-size="11" fill="#00FFA3" letter-spacing="1">INSIGHTS</text>
  <g stroke="#596275" stroke-width="0.6" opacity="0.5">
    <line x1="560" y1="330" x2="260" y2="398"/>
    <line x1="560" y1="340" x2="380" y2="436"/>
    <line x1="560" y1="350" x2="640" y2="426"/>
    <line x1="600" y1="330" x2="700" y2="376"/>
  </g>

  <!-- chart bars -->
  <g fill="#00FFA3">
    <rect x="120" y="430" width="18" height="50" opacity="0.5"/>
    <rect x="156" y="410" width="18" height="70" opacity="0.6"/>
    <rect x="192" y="380" width="18" height="100" opacity="0.7"/>
    <rect x="228" y="400" width="18" height="80" opacity="0.6"/>
    <rect x="264" y="360" width="18" height="120" opacity="0.85"/>
  </g>
  <g fill="#00E5FF">
    <rect x="660" y="450" width="16" height="40" opacity="0.5"/>
    <rect x="692" y="430" width="16" height="60" opacity="0.6"/>
    <rect x="724" y="400" width="16" height="90" opacity="0.7"/>
    <rect x="756" y="420" width="16" height="70" opacity="0.6"/>
  </g>
  <g stroke="#596275" stroke-width="0.6" opacity="0.5">
    <line x1="110" y1="490" x2="290" y2="490"/>
    <line x1="650" y1="500" x2="780" y2="500"/>
  </g>

  <!-- tech base -->
  <g>
    <rect x="300" y="540" width="300" height="50" rx="8" fill="rgba(0,255,163,0.04)" stroke="#596275" stroke-width="0.8"/>
    <g font-size="13" fill="#00E5FF" letter-spacing="1">
      <text x="360" y="554">REACT</text><text x="440" y="554">FIREBASE</text><text x="534" y="554">CHART.JS</text>
    </g>
  </g>

  <g font-size="11" fill="#8B96AE" letter-spacing="1">
    <text x="60" y="600">STATUS: FINANCIAL ORGAN</text>
    <text x="840" y="600" text-anchor="end">EVERY RUPEE VISUALIZED</text>
  </g>
</svg>