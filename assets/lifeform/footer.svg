<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" font-family="Consolas,'Courier New',monospace">
  <defs>
    <radialGradient id="bgVign" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#081118"/>
      <stop offset="55%" stop-color="#04080E"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="portGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMagenta" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="420" fill="url(#bgVign)"/>
  <g stroke="#596275" stroke-width="1" opacity="0.35">
    <path d="M25 25 H60 M25 25 V60"/>
    <path d="M1075 25 H1040 M1075 25 V60"/>
  </g>

  <text x="550" y="55" text-anchor="middle" font-size="24" fill="#FFFFFF" letter-spacing="5">EXTERNAL INTERFACES</text>
  <text x="550" y="80" text-anchor="middle" font-size="12" fill="#8B96AE" letter-spacing="3">HOW CHETHAN-01 COMMUNICATES WITH THE OUTSIDE WORLD</text>

  <!-- communication lines -->
  <path d="M550 110 C 550 130 550 140 550 160" fill="none" stroke="url(#portGrad)" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- ports -->
  <g>
    <!-- GITHUB -->
    <g>
      <circle cx="280" cy="240" r="58" fill="rgba(0,229,255,0.04)" stroke="#00E5FF" stroke-width="1.2"/>
      <circle cx="280" cy="240" r="42" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-dasharray="3 5">
        <animateTransform attributeName="transform" type="rotate" from="0 280 240" to="360 280 240" dur="14s" repeatCount="indefinite"/>
      </circle>
      <path d="M280 220 a16 16 0 0 0 0 40 a16 16 0 0 0 0 -40 M268 222 a16 16 0 0 1 24 10 M268 258 a16 16 0 0 0 24 -10 M280 228 v16 M272 238 h8" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#glowCyan)"/>
      <text x="280" y="326" text-anchor="middle" font-size="14" fill="#FFFFFF" letter-spacing="3">GITHUB</text>
      <text x="280" y="346" text-anchor="middle" font-size="10" fill="#8B96AE" letter-spacing="2">@chethangowda-web</text>
    </g>

    <!-- LINKEDIN -->
    <g>
      <circle cx="550" cy="240" r="58" fill="rgba(124,58,237,0.04)" stroke="#7C3AED" stroke-width="1.2"/>
      <circle cx="550" cy="240" r="42" fill="none" stroke="#7C3AED" stroke-width="0.8" stroke-dasharray="3 5">
        <animateTransform attributeName="transform" type="rotate" from="0 550 240" to="-360 550 240" dur="14s" repeatCount="indefinite"/>
      </circle>
      <g transform="translate(550,240)">
        <rect x="-18" y="-22" width="36" height="44" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.6"/>
        <circle cx="-7" cy="-12" r="3" fill="#7C3AED"/>
        <line x1="-7" y1="-6" x2="-7" y2="12" stroke="#7C3AED" stroke-width="2"/>
        <line x1="2" y1="-2" x2="2" y2="12" stroke="#7C3AED" stroke-width="2"/>
        <path d="M2 2 a5 5 0 0 1 8 0 v10" fill="none" stroke="#7C3AED" stroke-width="2"/>
      </g>
      <text x="550" y="326" text-anchor="middle" font-size="14" fill="#FFFFFF" letter-spacing="3">LINKEDIN</text>
      <text x="550" y="346" text-anchor="middle" font-size="10" fill="#8B96AE" letter-spacing="2">chethan-gowda-s-n</text>
    </g>

    <!-- EMAIL -->
    <g>
      <circle cx="820" cy="240" r="58" fill="rgba(176,38,255,0.04)" stroke="#B026FF" stroke-width="1.2"/>
      <circle cx="820" cy="240" r="42" fill="none" stroke="#B026FF" stroke-width="0.8" stroke-dasharray="3 5">
        <animateTransform attributeName="transform" type="rotate" from="0 820 240" to="360 820 240" dur="14s" repeatCount="indefinite"/>
      </circle>
      <rect x="802" y="224" width="36" height="28" rx="4" fill="none" stroke="#B026FF" stroke-width="2"/>
      <path d="M804 226 L820 244 L836 226" fill="none" stroke="#B026FF" stroke-width="1.6"/>
      <circle cx="820" cy="242" r="2" fill="#B026FF" filter="url(#glowMagenta)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="820" y="326" text-anchor="middle" font-size="14" fill="#FFFFFF" letter-spacing="3">EMAIL</text>
      <text x="820" y="346" text-anchor="middle" font-size="10" fill="#8B96AE" letter-spacing="1">iamchethan2813@gmail.com</text>
    </g>
  </g>

  <!-- heartbeat -->
  <path d="M 200 400 L 340 400 L 360 385 L 380 415 L 400 400 L 470 400 L 490 370 L 510 430 L 530 400 L 600 400 L 620 390 L 640 410 L 660 400 L 730 400 L 750 365 L 770 435 L 790 400 L 900 400"
    fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#glowCyan)"/>
  <circle r="3" fill="#FFFFFF" filter="url(#glowCyan)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 200 400 L 340 400 L 360 385 L 380 415 L 400 400 L 470 400 L 490 370 L 510 430 L 530 400 L 600 400 L 620 390 L 640 410 L 660 400 L 730 400 L 750 365 L 770 435 L 790 400 L 900 400"/>
  </circle>

  <text x="550" y="120" text-anchor="middle" font-size="11" fill="#8B96AE" letter-spacing="2">CHETHAN-01 REMAINS ONLINE — STILL EVOLVING</text>
</svg>