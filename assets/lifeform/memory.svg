<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Consolas,'Courier New',monospace">
  <defs>
    <radialGradient id="bgVign" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071408"/>
      <stop offset="55%" stop-color="#030A05"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="memGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00C2FF"/>
    </linearGradient>
    <linearGradient id="memGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <radialGradient id="memGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWhite" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <symbol id="snodeG" viewBox="-12 -12 24 24">
      <circle r="11" fill="none" stroke="#00FFA3" stroke-width="1" opacity="0.5"/>
      <circle r="5" fill="#00FFA3"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </symbol>
    <symbol id="scry" viewBox="-12 -12 24 24">
      <path d="M0,-9 L8,0 L0,9 L-8,0 Z" fill="rgba(0,255,163,0.08)" stroke="#00FFA3" stroke-width="1.1"/>
      <circle cx="0" cy="0" r="2" fill="#00FFA3"/>
    </symbol>
  </defs>

  <rect width="1000" height="620" fill="url(#bgVign)"/>
  <g stroke="#00FFA3" stroke-width="0.5" fill="none" opacity="0.07">
    <circle cx="500" cy="300" r="130"/><circle cx="500" cy="300" r="200"/>
    <circle cx="500" cy="300" r="270"/>
  </g>
  <g stroke="#596275" stroke-width="1" opacity="0.35">
    <path d="M25 25 H60 M25 25 V60"/>
    <path d="M975 25 H940 M975 25 V60"/>
  </g>

  <text x="500" y="60" text-anchor="middle" font-size="22" fill="#00FFA3" letter-spacing="5">MEMORY CORE</text>
  <text x="500" y="86" text-anchor="middle" font-size="12" fill="#8B96AE" letter-spacing="3">CRYSTALLINE STORAGE — DATA FLOWS IN AND OUT</text>

  <!-- glow -->
  <circle cx="500" cy="300" r="180" fill="url(#memGlow)"/>

  <!-- outer crystal -->
  <g fill="rgba(0,255,163,0.04)" stroke="url(#memGrad)" stroke-width="1.4">
    <polygon points="500,150 610,220 610,380 500,450 390,380 390,220"/>
  </g>
  <!-- crystal facets -->
  <g fill="none" stroke="#00FFA3" stroke-width="0.8" opacity="0.6">
    <line x1="500" y1="150" x2="500" y2="450"/>
    <line x1="390" y1="220" x2="610" y2="380"/>
    <line x1="610" y1="220" x2="390" y2="380"/>
    <line x1="390" y1="220" x2="610" y2="220"/>
    <line x1="390" y1="380" x2="610" y2="380"/>
  </g>

  <!-- mid crystal -->
  <g fill="rgba(0,255,163,0.05)" stroke="url(#memGrad2)" stroke-width="1.2">
    <polygon points="500,200 575,250 575,350 500,400 425,350 425,250"/>
  </g>
  <g fill="none" stroke="#00C2FF" stroke-width="0.6" opacity="0.5">
    <line x1="500" y1="200" x2="500" y2="400"/>
    <line x1="425" y1="250" x2="575" y2="350"/>
    <line x1="575" y1="250" x2="425" y2="350"/>
  </g>

  <!-- inner crystal core -->
  <g fill="rgba(0,255,163,0.08)" stroke="#00FFA3" stroke-width="1">
    <polygon points="500,245 545,275 545,325 500,355 455,325 455,275"/>
  </g>
  <circle cx="500" cy="300" r="12" fill="#00FFA3" filter="url(#glowGreen)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- data streams in -->
  <g fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.5">
    <path d="M120 220 C 240 240 320 260 400 280" stroke-dasharray="6 8"/>
    <path d="M120 380 C 240 360 320 340 400 320" stroke-dasharray="4 10"/>
  </g>
  <g>
    <circle r="2.6" fill="#00E5FF">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M120 220 C 240 240 320 260 400 280"/>
    </circle>
    <circle r="2.2" fill="#00E5FF">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M120 380 C 240 360 320 340 400 320"/>
    </circle>
  </g>
  <!-- data streams out -->
  <g fill="none" stroke="#00FFA3" stroke-width="1.2" opacity="0.5">
    <path d="M600 280 C 680 260 760 240 880 220" stroke-dasharray="6 8"/>
    <path d="M600 320 C 680 340 760 360 880 380" stroke-dasharray="4 10"/>
  </g>
  <g>
    <circle r="2.6" fill="#00FFA3" filter="url(#glowGreen)">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M600 280 C 680 260 760 240 880 220"/>
    </circle>
    <circle r="2.2" fill="#00FFA3">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M600 320 C 680 340 760 360 880 380"/>
    </circle>
  </g>

  <g font-size="11" fill="#8B96AE" letter-spacing="2">
    <text x="120" y="205" fill="#00E5FF">DATA IN</text>
    <text x="120" y="405" fill="#00E5FF">DATA IN</text>
    <text x="880" y="205" fill="#00FFA3" text-anchor="end">DATA OUT</text>
    <text x="880" y="405" fill="#00FFA3" text-anchor="end">DATA OUT</text>
  </g>

  <!-- storage nodes -->
  <use href="#scry" x="270" y="200"/>
  <use href="#scry" x="330" y="170"/>
  <use href="#scry" x="270" y="400"/>
  <use href="#scry" x="330" y="430"/>
  <use href="#scry" x="730" y="200"/>
  <use href="#scry" x="670" y="170"/>
  <use href="#scry" x="730" y="400"/>
  <use href="#scry" x="670" y="430"/>

  <!-- database labels -->
  <g font-size="13" fill="#00FFA3" letter-spacing="1">
    <text x="200" y="148" text-anchor="middle">POSTGRESQL</text>
    <text x="360" y="138" text-anchor="middle">MONGODB</text>
    <text x="640" y="138" text-anchor="middle">MYSQL</text>
    <text x="800" y="148" text-anchor="middle">REDIS</text>
    <text x="500" y="482" text-anchor="middle">QDRANT</text>
  </g>
  <g stroke="#596275" stroke-width="0.6" opacity="0.5">
    <line x1="200" y1="156" x2="270" y2="192"/>
    <line x1="360" y1="146" x2="330" y2="162"/>
    <line x1="640" y1="146" x2="670" y2="162"/>
    <line x1="800" y1="156" x2="730" y2="192"/>
    <line x1="500" y1="474" x2="500" y2="360"/>
  </g>

  <!-- memory concept -->
  <g font-size="12" fill="#8B96AE" letter-spacing="1">
    <text x="500" y="550" text-anchor="middle">APPLICATIONS GENERATE DATA → DATA ENTERS MEMORY → SYSTEMS RETRIEVE MEMORY</text>
  </g>
</svg>