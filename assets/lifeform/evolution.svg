<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Consolas,'Courier New',monospace">
  <defs>
    <radialGradient id="bgVign" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0A0716"/>
      <stop offset="55%" stop-color="#050310"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#B026FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowMagenta" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWhite" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <symbol id="sstage" viewBox="-12 -12 24 24">
      <circle cx="0" cy="0" r="16" fill="url(#nodeGlow)"/>
      <circle r="9" fill="none" stroke="#B026FF" stroke-width="1" opacity="0.6"/>
      <circle r="4.5" fill="#B026FF"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </symbol>
  </defs>

  <rect width="1100" height="760" fill="url(#bgVign)"/>
  <g stroke="#B026FF" stroke-width="0.5" fill="none" opacity="0.07">
    <circle cx="280" cy="380" r="200"/><circle cx="280" cy="380" r="290"/>
  </g>
  <g stroke="#596275" stroke-width="1" opacity="0.35">
    <path d="M25 25 H60 M25 25 V60"/>
    <path d="M1075 25 H1040 M1075 25 V60"/>
  </g>

  <text x="550" y="55" text-anchor="middle" font-size="24" fill="#B026FF" letter-spacing="5">EVOLUTION PROTOCOL</text>
  <text x="550" y="80" text-anchor="middle" font-size="12" fill="#8B96AE" letter-spacing="3">THE ORGANISM IS CONTINUOUSLY EVOLVING — NO PERCENTAGES, ONLY STAGES</text>

  <!-- evolution path -->
  <path d="M280 700 C 280 650 280 620 280 580" fill="none" stroke="url(#pathGrad)" stroke-width="2.5" filter="url(#glowMagenta)"/>
  <g>
    <circle r="3" fill="#FFFFFF" filter="url(#glowWhite)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M280 700 C 280 650 280 620 280 580"/>
    </circle>
  </g>

  <!-- stages -->
  <g font-size="14" fill="#00E5FF" letter-spacing="2">
    <use href="#sstage" x="280" y="580"/><text x="322" y="586">CURRENT STATE</text><text x="600" y="586" font-size="11" fill="#00FFA3" letter-spacing="1">ACTIVE</text>
    <use href="#sstage" x="280" y="500"/><text x="322" y="506">DSA</text><text x="600" y="506" font-size="11" fill="#00E5FF" letter-spacing="1">DEEPENING</text>
    <use href="#sstage" x="280" y="420"/><text x="322" y="426">SYSTEM DESIGN</text><text x="600" y="426" font-size="11" fill="#00E5FF" letter-spacing="1">DEEPENING</text>
    <use href="#sstage" x="280" y="340"/><text x="322" y="346">BACKEND</text><text x="600" y="346" font-size="11" fill="#00E5FF" letter-spacing="1">ACTIVE</text>
    <use href="#sstage" x="280" y="260"/><text x="322" y="266">DISTRIBUTED SYSTEMS</text><text x="600" y="266" font-size="11" fill="#8B96AE" letter-spacing="1">EXPLORING</text>
    <use href="#sstage" x="280" y="180"/><text x="322" y="186">AI ENGINEERING</text><text x="600" y="186" font-size="11" fill="#00FFA3" letter-spacing="1">ACTIVE</text>
    <use href="#sstage" x="280" y="100"/><text x="322" y="106">CLOUD</text><text x="600" y="106" font-size="11" fill="#8B96AE" letter-spacing="1">EXPLORING</text>
  </g>

  <!-- NEXT arrow -->
  <g>
    <path d="M280 700 L280 720 M280 720 L270 712 M280 720 L290 712" stroke="#B026FF" stroke-width="1.5" fill="none"/>
    <text x="280" y="742" text-anchor="middle" font-size="12" fill="#B026FF" letter-spacing="2">NEXT → SOFTWARE ENGINEER</text>
  </g>

  <!-- mutations panel -->
  <g>
    <rect x="700" y="120" width="360" height="360" fill="rgba(176,38,255,0.03)" stroke="#596275" stroke-width="0.8" rx="10"/>
    <text x="880" y="150" text-anchor="middle" font-size="16" fill="#FFFFFF" letter-spacing="3">EVOLUTIONARY MUTATIONS</text>
    <text x="880" y="170" text-anchor="middle" font-size="11" fill="#8B96AE" letter-spacing="2">BENEFICIAL MUTATIONS THAT CHANGED THE ORGANISM</text>

    <g font-size="13">
      <g><circle cx="740" cy="210" r="8" fill="rgba(0,229,255,0.10)" stroke="#00E5FF" stroke-width="1"/><text x="762" y="215" fill="#00E5FF" letter-spacing="1">MUTATION 01</text></g>
      <text x="762" y="240" fill="#FFFFFF" letter-spacing="1">AI AGENT BUILDER</text>

      <g><circle cx="740" cy="280" r="8" fill="rgba(0,255,163,0.10)" stroke="#00FFA3" stroke-width="1"/><text x="762" y="285" fill="#00FFA3" letter-spacing="1">MUTATION 02</text></g>
      <text x="762" y="310" fill="#FFFFFF" letter-spacing="1">TOP 25 VOLUNTEER</text>
      <text x="762" y="328" font-size="11" fill="#8B96AE" letter-spacing="1">AI AGENT BUILDER SERIES 2026</text>

      <g><circle cx="740" cy="360" r="8" fill="rgba(176,38,255,0.10)" stroke="#B026FF" stroke-width="1"/><text x="762" y="365" fill="#B026FF" letter-spacing="1">MUTATION 03</text></g>
      <text x="762" y="390" fill="#FFFFFF" letter-spacing="1">ADVANCED HACKATHON ENGINEERING</text>

      <g><circle cx="740" cy="430" r="8" fill="rgba(124,58,237,0.10)" stroke="#7C3AED" stroke-width="1"/><text x="762" y="435" fill="#7C3AED" letter-spacing="1">MUTATION 04</text></g>
      <text x="762" y="460" fill="#FFFFFF" letter-spacing="1">CIVIC-TECH / HEALTHTECH SYSTEMS</text>
    </g>
  </g>

  <!-- evolution target -->
  <g>
    <ellipse cx="880" cy="600" rx="160" ry="70" fill="url(#nodeGlow)" opacity="0.5"/>
    <ellipse cx="880" cy="600" rx="140" ry="58" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 6"/>
    <ellipse cx="880" cy="600" rx="110" ry="44" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
    <text x="880" y="590" text-anchor="middle" font-size="14" fill="#FFFFFF" letter-spacing="2">FULL-STACK</text>
    <text x="880" y="608" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="2">+ AI + SYSTEMS + SOFTWARE ENGINEERING</text>
    <text x="880" y="634" text-anchor="middle" font-size="16" fill="#00FFA3" letter-spacing="3">SOFTWARE ENGINEER</text>
    <text x="880" y="682" text-anchor="middle" font-size="11" fill="#8B96AE" letter-spacing="2">EVOLUTION TARGET</text>
  </g>

  <!-- link path target to target -->
  <path d="M500 120 C 640 120 700 160 700 200" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>
  <text x="570" y="112" font-size="11" fill="#8B96AE" letter-spacing="1">MUTATIONS →</text>
  <path d="M700 500 C 760 520 800 540 820 560" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>
  <text x="700" y="540" font-size="11" fill="#8B96AE" letter-spacing="1">→ TARGET</text>

  <g font-size="11" fill="#8B96AE" letter-spacing="1">
    <text x="60" y="740">STATUS: STILL EVOLVING</text>
  </g>
</svg>