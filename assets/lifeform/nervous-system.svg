<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Consolas,'Courier New',monospace">
  <defs>
    <radialGradient id="bgVign" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#07131A"/>
      <stop offset="55%" stop-color="#040A0E"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="execGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWhite" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <symbol id="snode" viewBox="-12 -12 24 24">
      <circle r="11" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
      <circle r="5" fill="#00E5FF"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </symbol>
    <symbol id="send" viewBox="-10 -10 20 20">
      <rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="rgba(0,229,255,0.10)" stroke="#00E5FF" stroke-width="1"/>
    </symbol>
  </defs>

  <rect width="1000" height="600" fill="url(#bgVign)"/>
  <g stroke="#596275" stroke-width="1" opacity="0.35">
    <path d="M25 25 H60 M25 25 V60"/>
    <path d="M975 25 H940 M975 25 V60"/>
  </g>

  <text x="500" y="60" text-anchor="middle" font-size="22" fill="#00E5FF" letter-spacing="5">EXECUTION NERVOUS SYSTEM</text>
  <text x="500" y="86" text-anchor="middle" font-size="12" fill="#8B96AE" letter-spacing="3">HIGH-SPEED ELECTRICAL PATHWAYS — REQUESTS TRAVEL AS PARTICLES</text>

  <!-- source core -->
  <g>
    <circle cx="200" cy="300" r="80" fill="url(#execGrad)" opacity="0.10"/>
    <circle cx="200" cy="300" r="52" fill="rgba(0,229,255,0.06)" stroke="#00E5FF" stroke-width="1.2"/>
    <circle cx="200" cy="300" r="34" fill="url(#execGrad)" opacity="0.25"/>
    <circle cx="200" cy="300" r="12" fill="#FFFFFF" filter="url(#glowWhite)">
      <animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="200" y="380" text-anchor="middle" font-size="13" fill="#00E5FF" letter-spacing="2">CORE</text>
  </g>

  <!-- main trunk -->
  <path d="M260 300 C 380 300 420 300 520 300" fill="none" stroke="url(#execGrad)" stroke-width="2.5" filter="url(#glowCyan)"/>
  <!-- branches -->
  <g fill="none" stroke="#00E5FF" stroke-width="1.4" opacity="0.6">
    <path d="M520 300 C 620 300 680 260 780 220"/>
    <path d="M520 300 C 620 300 680 300 800 300"/>
    <path d="M520 300 C 620 300 680 340 780 380"/>
    <path d="M780 220 C 830 200 860 190 900 180"/>
    <path d="M780 380 C 830 400 860 410 900 420"/>
    <path d="M800 300 L900 300"/>
  </g>
  <!-- violet secondary -->
  <g fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.5">
    <path d="M620 300 C 660 350 700 390 760 430"/>
    <path d="M620 300 C 660 250 700 210 760 170"/>
  </g>

  <!-- pulses -->
  <g>
    <circle r="3" fill="#FFFFFF" filter="url(#glowWhite)">
      <animateMotion dur="2s" repeatCount="indefinite" path="M260 300 C 380 300 420 300 520 300"/>
    </circle>
    <circle r="2.6" fill="#00E5FF" filter="url(#glowCyan)">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M520 300 C 620 300 680 260 780 220"/>
    </circle>
    <circle r="2.2" fill="#00E5FF">
      <animateMotion dur="3s" repeatCount="indefinite" path="M520 300 C 620 300 680 300 800 300"/>
    </circle>
    <circle r="2.4" fill="#B026FF">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M620 300 C 660 350 700 390 760 430"/>
    </circle>
    <circle r="2" fill="#00E5FF">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M520 300 C 620 300 680 340 780 380"/>
    </circle>
  </g>

  <!-- endpoint nodes -->
  <use href="#snode" x="780" y="220"/>
  <use href="#snode" x="800" y="300"/>
  <use href="#snode" x="780" y="380"/>
  <use href="#send" x="900" y="180"/>
  <use href="#send" x="900" y="420"/>
  <use href="#send" x="900" y="300"/>
  <use href="#send" x="760" y="430"/>
  <use href="#send" x="760" y="170"/>

  <g font-size="13" fill="#00E5FF" letter-spacing="1">
    <text x="780" y="202" text-anchor="middle">NODE.JS</text>
    <text x="800" y="282" text-anchor="middle">EXPRESS</text>
    <text x="780" y="362" text-anchor="middle">FASTAPI</text>
    <text x="900" y="162" text-anchor="middle">REST API</text>
    <text x="900" y="402" text-anchor="middle">REST API</text>
    <text x="900" y="282" text-anchor="middle">APIs</text>
  </g>

  <!-- request label -->
  <g font-size="11" fill="#8B96AE" letter-spacing="2">
    <text x="420" y="318">REQUEST →</text>
    <text x="560" y="250">→ RESPONSE</text>
  </g>

  <!-- footnotes -->
  <g font-size="11" fill="#8B96AE" letter-spacing="1">
    <text x="60" y="560">REQUESTS ENTER FROM THE CORE AND PROPAGATE DOWN THE NERVOUS SYSTEM</text>
    <text x="940" y="560" text-anchor="end">EVERY RESPONSE RETURNS TO THE CORE</text>
  </g>
</svg>