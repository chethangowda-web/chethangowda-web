<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" font-family="Consolas,'Courier New',monospace">
  <defs>
    <radialGradient id="bgVign" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#07100E"/>
      <stop offset="55%" stop-color="#03080A"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00FFA3" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- cell pattern -->
    <pattern id="cells" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="7" r="1.2" fill="#00FFA3" opacity="0.22"/>
      <circle cx="15" cy="4" r="1.6" fill="#00E5FF" opacity="0.18"/>
      <circle cx="24" cy="9" r="1.1" fill="#00FFA3" opacity="0.14"/>
      <circle cx="8" cy="18" r="1.4" fill="#00E5FF" opacity="0.20"/>
      <circle cx="18" cy="16" r="1.1" fill="#00FFA3" opacity="0.16"/>
      <circle cx="26" cy="22" r="1.5" fill="#00E5FF" opacity="0.18"/>
      <circle cx="4" cy="26" r="1.1" fill="#00FFA3" opacity="0.12"/>
      <circle cx="21" cy="27" r="1.3" fill="#00FFA3" opacity="0.16"/>
    </pattern>
    <pattern id="cellsBright" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="7" r="1.7" fill="#00FFA3" opacity="0.55"/>
      <circle cx="15" cy="4" r="1.9" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="24" cy="9" r="1.6" fill="#00FFA3" opacity="0.4"/>
      <circle cx="8" cy="18" r="1.8" fill="#00E5FF" opacity="0.5"/>
      <circle cx="18" cy="16" r="1.5" fill="#00FFA3" opacity="0.42"/>
      <circle cx="26" cy="22" r="1.9" fill="#FFFFFF" opacity="0.45"/>
      <circle cx="4" cy="26" r="1.5" fill="#00FFA3" opacity="0.36"/>
      <circle cx="21" cy="27" r="1.8" fill="#00E5FF" opacity="0.44"/>
    </pattern>
  </defs>

  <rect width="1100" height="460" fill="url(#bgVign)"/>

  <!-- thousands of cells -->
  <rect width="1100" height="460" fill="url(#cells)"/>
  <!-- activated cluster around core -->
  <circle cx="550" cy="230" r="150" fill="url(#coreGlow)"/>
  <ellipse cx="550" cy="230" rx="180" ry="130" fill="url(#cellsBright)" opacity="0.9"/>

  <!-- organism silhouette hint -->
  <g stroke="#00E5FF" stroke-width="0.8" fill="none" opacity="0.3">
    <ellipse cx="550" cy="230" rx="110" ry="90"/>
    <circle cx="550" cy="230" r="34"/>
    <path d="M550 140 C 550 150 550 160 550 180"/>
    <path d="M440 230 C 460 230 480 230 500 230"/>
    <path d="M600 230 C 620 230 640 230 660 230"/>
  </g>

  <!-- pulsing activated cells -->
  <g>
    <circle cx="480" cy="200" r="2.6" fill="#00FFA3" filter="url(#glowGreen)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="260" r="2.4" fill="#00E5FF" filter="url(#glowCyan)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="280" r="2.2" fill="#FFFFFF" filter="url(#glowCyan)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="190" r="2.2" fill="#00FFA3" filter="url(#glowGreen)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="250" r="2" fill="#00E5FF" filter="url(#glowCyan)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="220" r="2.6" fill="#00FFA3" filter="url(#glowGreen)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- spreading activation waves -->
  <g stroke="#00FFA3" stroke-width="1" fill="none" opacity="0.35">
    <circle cx="550" cy="230" r="70">
      <animate attributeName="r" values="50;90;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="230" r="110">
      <animate attributeName="r" values="80;140;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="550" y="80" text-anchor="middle" font-size="22" fill="#00FFA3" letter-spacing="5">CELLULAR ACTIVITY</text>
  <text x="550" y="104" text-anchor="middle" font-size="12" fill="#8B96AE" letter-spacing="3">EVERY CONTRIBUTION = ONE CELL ACTIVATION</text>

  <g font-size="11" fill="#8B96AE" letter-spacing="2">
    <text x="550" y="430" text-anchor="middle">REAL CONTRIBUTION DATA BELOW</text>
  </g>
</svg>