<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Consolas,'Courier New',monospace">
  <defs>
    <radialGradient id="bgVign" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08131A"/>
      <stop offset="55%" stop-color="#040A0E"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#D6F8FF"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="reactor" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#AEF2FF"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>

    <filter id="glowWhite" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMagenta" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="620" fill="url(#bgVign)"/>
  <g stroke="#00E5FF" stroke-width="0.5" fill="none" opacity="0.08">
    <circle cx="450" cy="310" r="140"/><circle cx="450" cy="310" r="210"/>
    <circle cx="450" cy="310" r="280"/>
  </g>
  <g stroke="#596275" stroke-width="1" opacity="0.35">
    <path d="M25 25 H60 M25 25 V60"/>
    <path d="M875 25 H840 M875 25 V60"/>
  </g>

  <text x="450" y="60" text-anchor="middle" font-size="22" fill="#00E5FF" letter-spacing="5">ENGINEERING CORE</text>
  <text x="450" y="86" text-anchor="middle" font-size="12" fill="#8B96AE" letter-spacing="3">PRIMARY ENERGY SOURCE — CENTER OF THE ORGANISM</text>

  <!-- reactor glow -->
  <circle cx="450" cy="320" r="230" fill="url(#coreGlow)" filter="url(#glowWhite)"/>

  <!-- rotating rings -->
  <g>
    <circle cx="450" cy="320" r="205" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="12 26" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 450 320" to="360 450 320" dur="42s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="320" r="178" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4 18" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 450 320" to="-360 450 320" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="320" r="152" fill="none" stroke="#B026FF" stroke-width="0.8" stroke-dasharray="2 12" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 450 320" to="360 450 320" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- tick ring -->
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.5">
    <line x1="450" y1="108" x2="450" y2="120"/>
    <line x1="450" y1="520" x2="450" y2="532"/>
    <line x1="243" y1="320" x2="255" y2="320"/>
    <line x1="645" y1="320" x2="657" y2="320"/>
  </g>

  <!-- orbit electrons -->
  <g>
    <circle cx="450" cy="128" r="3.2" fill="#FFFFFF" filter="url(#glowWhite)">
      <animateTransform attributeName="transform" type="rotate" from="0 450 320" to="360 450 320" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="645" cy="320" r="2.8" fill="#00E5FF" filter="url(#glowCyan)">
      <animateTransform attributeName="transform" type="rotate" from="0 450 320" to="-360 450 320" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="512" r="2.4" fill="#B026FF" filter="url(#glowMagenta)">
      <animateTransform attributeName="transform" type="rotate" from="0 450 320" to="360 450 320" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="255" cy="320" r="2.6" fill="#00FFA3">
      <animateTransform attributeName="transform" type="rotate" from="0 450 320" to="-360 450 320" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- reactor sphere -->
  <circle cx="450" cy="320" r="118" fill="url(#reactor)"/>
  <circle cx="450" cy="320" r="118" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <circle cx="450" cy="320" r="74" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.35"/>
  <circle cx="450" cy="320" r="42" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.4"/>

  <!-- white hot center -->
  <circle cx="450" cy="324" r="9" fill="#FFFFFF" filter="url(#glowWhite)">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- identity text -->
  <g text-anchor="middle" font-family="Consolas,'Courier New',monospace">
    <text x="450" y="284" fill="#FFFFFF" font-size="21" letter-spacing="2">CHETHAN GOWDA</text>
    <text x="450" y="342" fill="#00E5FF" font-size="15" letter-spacing="4">FULL-STACK</text>
    <text x="450" y="364" fill="#B026FF" font-size="15" letter-spacing="4">AI</text>
    <text x="450" y="386" fill="#7C3AED" font-size="15" letter-spacing="4">BACKEND</text>
    <text x="450" y="408" fill="#00FFA3" font-size="15" letter-spacing="4">SYSTEMS</text>
  </g>

  <!-- energy streams -->
  <g stroke="#00E5FF" stroke-width="1.2" fill="none" opacity="0.5">
    <path d="M300 200 C 250 240 230 280 220 320" stroke-dasharray="6 8"/>
    <path d="M600 200 C 650 240 670 280 680 320" stroke-dasharray="6 8"/>
    <path d="M300 440 C 250 400 230 360 220 320" stroke-dasharray="4 10"/>
    <path d="M600 440 C 650 400 670 360 680 320" stroke-dasharray="4 10"/>
  </g>
  <g>
    <circle r="2.6" fill="#00E5FF" filter="url(#glowCyan)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M300 200 C 250 240 230 280 220 320"/>
    </circle>
    <circle r="2.2" fill="#00E5FF">
      <animateMotion dur="3s" repeatCount="indefinite" path="M600 200 C 650 240 670 280 680 320"/>
    </circle>
    <circle r="2" fill="#B026FF">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M300 440 C 250 400 230 360 220 320"/>
    </circle>
  </g>

  <!-- output -->
  <g font-size="12" fill="#8B96AE" letter-spacing="2">
    <text x="120" y="320" text-anchor="middle" fill="#00E5FF">ENERGY</text>
    <text x="780" y="320" text-anchor="middle" fill="#00E5FF">OUTPUT</text>
  </g>
  <g stroke="#596275" stroke-width="0.8" opacity="0.5">
    <line x1="150" y1="320" x2="200" y2="320"/>
    <line x1="700" y1="320" x2="750" y2="320"/>
  </g>

  <!-- spec tags -->
  <g font-size="11" fill="#8B96AE" letter-spacing="1">
    <text x="60" y="565">STATUS: ACTIVE</text>
    <text x="780" y="565" text-anchor="end">OUTPUT: FULL-STACK · AI · BACKEND · SYSTEMS</text>
  </g>
</svg>