<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Consolas,'Courier New',monospace">
  <defs>
    <radialGradient id="bgVign" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08151A"/>
      <stop offset="55%" stop-color="#040A0E"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="resGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <symbol id="snode" viewBox="-12 -12 24 24">
      <circle r="11" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
      <circle r="5" fill="#00E5FF"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </symbol>
    <symbol id="snodeG" viewBox="-12 -12 24 24">
      <circle r="11" fill="none" stroke="#00FFA3" stroke-width="1" opacity="0.5"/>
      <circle r="5" fill="#00FFA3"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </symbol>
  </defs>

  <rect width="1100" height="700" fill="url(#bgVign)"/>
  <g stroke="#596275" stroke-width="1" opacity="0.35">
    <path d="M25 25 H60 M25 25 V60"/>
    <path d="M1075 25 H1040 M1075 25 V60"/>
  </g>

  <text x="550" y="55" text-anchor="middle" font-size="24" fill="#00E5FF" letter-spacing="6">SARA</text>
  <text x="550" y="80" text-anchor="middle" font-size="12" fill="#8B96AE" letter-spacing="3">SPECIALIZED ORGAN 01 — SMART ACCOUNTABILITY &amp; RESOLUTION ASSISTANT</text>
  <text x="550" y="98" text-anchor="middle" font-size="12" fill="#00FFA3" letter-spacing="2">CIVIC SIGNAL PROCESSING ORGAN</text>

  <!-- organ body membrane -->
  <ellipse cx="550" cy="360" rx="460" ry="230" fill="rgba(0,229,255,0.03)" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3 8" opacity="0.5"/>

  <!-- PIPELINE: citizen signal -> resolution -->
  <g>
    <!-- connecting pipes -->
    <g stroke="url(#pipeGrad)" stroke-width="2" fill="none" opacity="0.7">
      <path d="M150 200 L290 200"/>
      <path d="M400 200 L470 260"/>
      <path d="M580 260 L610 330"/>
      <path d="M610 330 L580 400"/>
      <path d="M470 440 L400 500"/>
      <path d="M290 500 L150 500"/>
    </g>
    <!-- particles traveling -->
    <g>
      <circle r="3" fill="#00E5FF" filter="url(#glowCyan)"><animateMotion dur="1.6s" repeatCount="indefinite" path="M150 200 L290 200"/></circle>
      <circle r="3" fill="#00E5FF" filter="url(#glowCyan)"><animateMotion dur="1.6s" repeatCount="indefinite" path="M400 200 L470 260"/></circle>
      <circle r="2.6" fill="#00FFA3"><animateMotion dur="1.8s" repeatCount="indefinite" path="M580 260 L610 330"/></circle>
      <circle r="2.6" fill="#00FFA3"><animateMotion dur="1.8s" repeatCount="indefinite" path="M610 330 L580 400"/></circle>
      <circle r="3" fill="#00E5FF"><animateMotion dur="1.6s" repeatCount="indefinite" path="M470 440 L400 500"/></circle>
      <circle r="3" fill="#00E5FF"><animateMotion dur="1.6s" repeatCount="indefinite" path="M290 500 L150 500"/></circle>
    </g>

    <!-- stage nodes -->
    <g>
      <use href="#snode" x="290" y="200"/><text x="290" y="180" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="1">CITIZEN SIGNAL</text>
      <use href="#snode" x="470" y="260"/><text x="470" y="240" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="1">CLASSIFICATION</text>
      <use href="#snode" x="610" y="330"/><text x="610" y="310" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="1">PRIORITY</text>
      <use href="#snode" x="580" y="400"/><text x="580" y="380" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="1">ACCOUNTABILITY</text>
      <use href="#snode" x="400" y="500"/><text x="400" y="480" text-anchor="middle" font-size="12" fill="#00E5FF" letter-spacing="1">ESCALATION</text>
      <use href="#snodeG" x="150" y="500"/><text x="150" y="480" text-anchor="middle" font-size="12" fill="#00FFA3" letter-spacing="1">RESOLUTION</text>
    </g>
  </g>

  <!-- side capability modules -->
  <g>
    <g stroke="#00E5FF" stroke-width="0.6" opacity="0.5">
      <line x1="740" y1="240" x2="640" y2="290"/>
      <line x1="740" y1="330" x2="650" y2="360"/>
      <line x1="740" y1="440" x2="650" y2="430"/>
      <line x1="740" y1="540" x2="650" y2="500"/>
    </g>
    <g font-size="12" fill="#00E5FF" letter-spacing="1">
      <text x="870" y="170" text-anchor="middle">DUPLICATE</text>
      <text x="870" y="185" text-anchor="middle">DETECTION</text>
      <text x="870" y="260" text-anchor="middle">SENTIMENT</text>
      <text x="870" y="275" text-anchor="middle">/ URGENCY</text>
      <text x="870" y="380" text-anchor="middle">RAG</text>
      <text x="870" y="470" text-anchor="middle">SLA</text>
      <text x="870" y="485" text-anchor="middle">MONITORING</text>
      <text x="870" y="560" text-anchor="middle">RESOLUTION</text>
      <text x="870" y="575" text-anchor="middle">VERIFICATION</text>
    </g>
    <g>
      <use href="#snodeG" x="780" y="240"/><use href="#snodeG" x="780" y="330"/>
      <use href="#snodeG" x="780" y="440"/><use href="#snodeG" x="780" y="540"/>
    </g>
    <rect x="830" y="150" width="90" height="440" fill="none" stroke="#00FFA3" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.4"/>
  </g>

  <!-- organ inlet -->
  <g font-size="11" fill="#8B96AE">
    <text x="150" y="160" text-anchor="middle" letter-spacing="2">INLET — PUBLIC INPUT</text>
  </g>
  <!-- organ outlet -->
  <g font-size="11" fill="#8B96AE">
    <text x="150" y="540" text-anchor="middle" letter-spacing="2">OUTLET — RESOLVED OUTCOME</text>
  </g>

  <!-- tech base -->
  <g>
    <rect x="330" y="600" width="440" height="50" rx="8" fill="rgba(0,229,255,0.04)" stroke="#596275" stroke-width="0.8"/>
    <g font-size="13" fill="#00E5FF" letter-spacing="1">
      <text x="390" y="614">FASTAPI</text><text x="470" y="614">POSTGRESQL</text><text x="572" y="614">REDIS</text><text x="634" y="614">CELERY</text>
      <text x="402" y="640">REACT</text><text x="486" y="640">DOCKER</text>
    </g>
  </g>

  <g font-size="11" fill="#8B96AE" letter-spacing="1">
    <text x="60" y="680">STATUS: DEPLOYED ORGAN</text>
    <text x="1040" y="680" text-anchor="end">CIVIC-TECH / ACCOUNTABILITY PIPELINE</text>
  </g>
</svg>