<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02060A"/>
      <stop offset="60%" stop-color="#04100D"/>
      <stop offset="100%" stop-color="#051A14"/>
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E2A23"/>
      <stop offset="50%" stop-color="#0B241F"/>
      <stop offset="100%" stop-color="#081C18"/>
    </linearGradient>
    <linearGradient id="vaultTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14554A"/>
      <stop offset="100%" stop-color="#0B241F"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4A8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00D4A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00D4A8"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#0A1E1A" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.5"/>
  <ellipse cx="600" cy="380" rx="540" ry="60" fill="url(#glowGreen)" filter="url(#glow)"/>

  <!-- underground tunnel atmosphere lines -->
  <g stroke="#0D2C26" stroke-width="1">
    <path d="M 0 70 L 1200 70"/>
    <path d="M 0 90 L 1200 90"/>
    <path d="M 0 350 L 1200 350"/>
  </g>

  <!-- DATA VAULTS (cylinders) -->
  <g>
    <!-- POSTGRESQL -->
    <g transform="translate(200,0)">
      <ellipse cx="0" cy="150" rx="75" ry="16" fill="url(#vaultTop)"/>
      <rect x="-75" y="150" width="150" height="160" fill="url(#vaultGrad)" stroke="#00D4A8" stroke-width="1.2"/>
      <ellipse cx="0" cy="310" rx="75" ry="16" fill="#06211C" stroke="#00D4A8" stroke-width="1.2"/>
      <g stroke="#00D4A8" stroke-width="0.8" opacity="0.6">
        <line x1="-75" y1="200" x2="75" y2="200"/><line x1="-75" y1="250" x2="75" y2="250"/>
      </g>
      <g fill="#00D4A8" opacity="0.9">
        <circle cx="-40" cy="170" r="4"/><circle cx="10" cy="170" r="4"/><circle cx="-40" cy="215" r="4"/><circle cx="30" cy="215" r="4"/>
        <circle cx="-20" cy="265" r="4"/><circle cx="45" cy="265" r="4"/>
      </g>
      <text x="0" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#00D4A8" font-weight="700">POSTGRESQL</text>
    </g>

    <!-- MONGODB -->
    <g transform="translate(430,0)">
      <ellipse cx="0" cy="130" rx="65" ry="14" fill="url(#vaultTop)"/>
      <rect x="-65" y="130" width="130" height="180" fill="url(#vaultGrad)" stroke="#00D4A8" stroke-width="1.2"/>
      <ellipse cx="0" cy="310" rx="65" ry="14" fill="#06211C" stroke="#00D4A8" stroke-width="1.2"/>
      <path d="M -65 170 L 65 210" stroke="#00D4A8" stroke-width="0.8" opacity="0.6"/>
      <path d="M -65 250 L 65 290" stroke="#00D4A8" stroke-width="0.8" opacity="0.6"/>
      <g fill="#00D4A8" opacity="0.9">
        <circle cx="-30" cy="150" r="4"/><circle cx="25" cy="150" r="4"/><circle cx="0" cy="230" r="4"/><circle cx="-40" cy="270" r="4"/>
      </g>
      <text x="0" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#00D4A8" font-weight="700">MONGODB</text>
    </g>

    <!-- MYSQL -->
    <g transform="translate(660,0)">
      <ellipse cx="0" cy="160" rx="70" ry="15" fill="url(#vaultTop)"/>
      <rect x="-70" y="160" width="140" height="150" fill="url(#vaultGrad)" stroke="#00D4A8" stroke-width="1.2"/>
      <ellipse cx="0" cy="310" rx="70" ry="15" fill="#06211C" stroke="#00D4A8" stroke-width="1.2"/>
      <g stroke="#00D4A8" stroke-width="0.8" opacity="0.6">
        <line x1="-70" y1="210" x2="70" y2="210"/><line x1="-70" y1="260" x2="70" y2="260"/>
      </g>
      <g fill="#00D4A8" opacity="0.9">
        <circle cx="-35" cy="180" r="4"/><circle cx="20" cy="180" r="4"/><circle cx="-45" cy="230" r="4"/><circle cx="15" cy="230" r="4"/>
      </g>
      <text x="0" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#00D4A8" font-weight="700">MYSQL</text>
    </g>

    <!-- REDIS -->
    <g transform="translate(890,0)">
      <ellipse cx="0" cy="120" rx="55" ry="12" fill="url(#vaultTop)"/>
      <rect x="-55" y="120" width="110" height="190" fill="url(#vaultGrad)" stroke="#B967FF" stroke-width="1.2"/>
      <ellipse cx="0" cy="310" rx="55" ry="12" fill="#120C1E" stroke="#B967FF" stroke-width="1.2"/>
      <g stroke="#B967FF" stroke-width="0.8" opacity="0.6">
        <line x1="-55" y1="180" x2="55" y2="180"/><line x1="-55" y1="240" x2="55" y2="240"/>
      </g>
      <g fill="#B967FF" opacity="0.9">
        <circle cx="-25" cy="145" r="4"/><circle cx="25" cy="145" r="4"/><circle cx="-25" cy="265" r="4"/><circle cx="25" cy="265" r="4"/>
      </g>
      <text x="0" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#B967FF" font-weight="700">REDIS</text>
    </g>
  </g>

  <!-- DATA STREAMS between vaults -->
  <g stroke="#00D4A8" stroke-width="1.5" opacity="0.7">
    <path d="M 275 170 L 365 150"/>
    <path d="M 495 200 L 590 190"/>
    <path d="M 730 200 L 835 170"/>
  </g>
  <g fill="#00D4A8">
    <circle cx="315" cy="162" r="3"/><circle cx="535" cy="197" r="3"/><circle cx="780" cy="186" r="3"/>
  </g>
  <!-- stream up to backend -->
  <g stroke="#7B61FF" stroke-width="1.5" opacity="0.6">
    <path d="M 430 120 C 440 90, 440 60, 470 45"/>
    <path d="M 660 130 C 650 90, 660 60, 640 45"/>
  </g>
  <text x="600" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#64748B">GLOWING STREAMS → BACKEND DISTRICT</text>

  <text x="600" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="url(#titleGrad)">DATA DISTRICT</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#64748B">UNDERGROUND DATA VAULTS</text>
</svg>