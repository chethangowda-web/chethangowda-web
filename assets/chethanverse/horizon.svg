<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060C"/>
      <stop offset="55%" stop-color="#0A0D20"/>
      <stop offset="100%" stop-color="#1A1030"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#4CC9F0" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#4CC9F0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <linearGradient id="destGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#0D1524" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect y="240" width="1200" height="160" fill="url(#grid)" opacity="0.35"/>

  <!-- horizon -->
  <ellipse cx="600" cy="250" rx="420" ry="70" fill="url(#sunGlow)" filter="url(#glow)"/>
  <circle cx="600" cy="250" r="52" fill="url(#sunGlow)"/>
  <line x1="0" y1="250" x2="1200" y2="250" stroke="#2A2240" stroke-width="1.5"/>
  <!-- distant skyline -->
  <g fill="#141026">
    <rect x="80" y="220" width="22" height="30"/><rect x="120" y="208" width="26" height="42"/>
    <rect x="170" y="224" width="20" height="26"/><rect x="960" y="216" width="24" height="34"/>
    <rect x="1000" y="202" width="28" height="48"/><rect x="1050" y="222" width="22" height="28"/>
  </g>

  <!-- THE ROAD (ascent to horizon) -->
  <path d="M 600 400 L 600 300" stroke="#2A3A55" stroke-width="2"/>
  <path d="M 600 400 L 600 300" stroke="#4CC9F0" stroke-width="1" opacity="0.5"/>
  <path d="M 600 300 L 600 270" stroke="#7B61FF" stroke-width="2"/>

  <!-- milestone nodes -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">
    <circle cx="600" cy="372" r="5" fill="#4CC9F0"/><text x="668" y="375" fill="#A9E7FF">DSA</text>
    <circle cx="600" cy="344" r="5" fill="#4CC9F0"/><text x="668" y="347" fill="#A9E7FF">SYSTEM DESIGN</text>
    <circle cx="600" cy="316" r="5" fill="#7B61FF"/><text x="668" y="319" fill="#C9BFFF">BACKEND</text>
    <circle cx="600" cy="288" r="5" fill="#B967FF"/><text x="668" y="291" fill="#E3C2FF">AI ENGINEERING</text>
    <circle cx="600" cy="262" r="5" fill="#00D4A8"/><text x="668" y="265" fill="#7CFFDD">CLOUD</text>
  </g>

  <!-- DESTINATION -->
  <g>
    <rect x="380" y="108" width="440" height="64" rx="10" fill="#0B1220" stroke="#7B61FF" stroke-width="1.5" opacity="0.95"/>
    <rect x="380" y="108" width="440" height="64" rx="10" fill="#7B61FF" opacity="0.08"/>
    <text x="600" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="5" fill="#8B9BB4">DESTINATION</text>
    <text x="600" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="url(#destGrad)">SDE / SOFTWARE ENGINEER</text>
  </g>
  <circle cx="600" cy="108" r="6" fill="#7BE3FF"/>
  <line x1="600" y1="114" x2="600" y2="250" stroke="#7B61FF" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>

  <!-- particles -->
  <g>
    <circle cx="200" cy="150" r="1.5" fill="#B967FF" filter="url(#soft)"/>
    <circle cx="1000" cy="140" r="1.5" fill="#4CC9F0"/>
    <circle cx="340" cy="90" r="1.2" fill="#4CC9F0"/>
    <circle cx="860" cy="96" r="1.2" fill="#B967FF"/>
  </g>

  <text x="600" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="8" fill="url(#titleGrad)">NEXT HORIZON</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#64748B">WHERE THE ROAD LEADS</text>
</svg>