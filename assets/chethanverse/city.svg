    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0E1626" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blurHaze"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="faint"><feGaussianBlur stdDeviation="14"/></filter>
