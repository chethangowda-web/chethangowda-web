    <rect x="315" y="214" width="6" height="9"/><rect x="330" y="214" width="6" height="9"/><rect x="345" y="214" width="6" height="9"/>
    <rect x="315" y="236" width="6" height="9"/><rect x="345" y="236" width="6" height="9"/>
    <rect x="315" y="258" width="6" height="9"/><rect x="330" y="258" width="6" height="9"/><rect x="345" y="258" width="6" height="9"/>
    <rect x="432" y="240" width="5" height="8"/><rect x="447" y="240" width="5" height="8"/>
