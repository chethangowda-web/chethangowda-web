    <circle cx="420" cy="28" r="1.3"/><circle cx="590" cy="55" r="0.8"/>
    <circle cx="760" cy="24" r="1.1"/><circle cx="980" cy="44" r="1.2"/>
    <circle cx="1150" cy="30" r="0.9"/><circle cx="1320" cy="62" r="1.3"/>
    <circle cx="1490" cy="36" r="1.0"/><circle cx="320" cy="130" r="0.7"/>
