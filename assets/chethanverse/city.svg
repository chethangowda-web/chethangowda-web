    <rect x="210" y="365" width="26" height="75"/><rect x="250" y="350" width="32" height="90"/>
    <rect x="295" y="378" width="24" height="62"/>
    <rect x="1040" y="358" width="28" height="82"/><rect x="1082" y="332" width="34" height="108"/>
    <rect x="1130" y="370" width="24" height="70"/><rect x="1168" y="348" width="30" height="92"/>
    <rect x="1212" y="362" width="26" height="78"/><rect x="1252" y="340" width="34" height="100"/>
    <rect x="1300" y="372" width="24" height="68"/>
    <rect x="1380" y="360" width="26" height="80"/><rect x="1420" y="335" width="32" height="105"/>
    <rect x="1466" y="368" width="26" height="72"/><rect x="1506" y="350" width="30" height="90"/>
