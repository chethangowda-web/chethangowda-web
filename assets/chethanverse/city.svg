  <text x="800" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="5" fill="#64748B">INFRASTRUCTURE BACKBONE — EVERYTHING IS CONNECTED</text>
