<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060C"/>
      <stop offset="52%" stop-color="#070C18"/>
      <stop offset="100%" stop-color="#0B1222"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#18263E"/>
      <stop offset="50%" stop-color="#101B31"/>
      <stop offset="100%" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="glassCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2F4D"/>
      <stop offset="50%" stop-color="#12203800"/>
      <stop offset="100%" stop-color="#0B1526"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B967FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#B967FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4A8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00D4A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7B61FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C9D6FF"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
