      <rect x="764" y="182" width="8" height="6"/><rect x="796" y="182" width="8" height="6"/><rect x="858" y="182" width="8" height="6"/>
      <rect x="730" y="232" width="8" height="6"/><rect x="796" y="232" width="8" height="6"/><rect x="830" y="232" width="8" height="6"/>
      <rect x="764" y="282" width="8" height="6"/><rect x="830" y="282" width="8" height="6"/><rect x="858" y="282" width="8" height="6"/>
      <rect x="730" y="332" width="8" height="6"/><rect x="796" y="332" width="8" height="6"/><rect x="858" y="332" width="8" height="6"/>
