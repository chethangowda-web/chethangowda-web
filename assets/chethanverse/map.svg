<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03050A"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#0D1524" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)" opacity="0.5"/>

  <!-- ROADS -->
  <g fill="#05080F" stroke="#141F38" stroke-width="1">
    <rect x="540" y="140" width="120" height="660"/>   <!-- vertical spine -->
    <rect x="150" y="330" width="900" height="90"/>    <!-- horizontal avenue -->
    <rect x="540" y="500" width="120" height="40"/>    <!-- connector -->
  </g>
  <!-- glowing lanes -->
  <g stroke="#4CC9F0" stroke-width="1" opacity="0.35">
    <line x1="600" y1="140" x2="600" y2="800"/>
    <line x1="160" y1="375" x2="1040" y2="375"/>
  </g>

  <!-- data packets travelling -->
  <g>
    <circle cx="600" cy="300" r="3.5" fill="#B967FF" filter="url(#soft)"/>
    <circle cx="600" cy="470" r="3.5" fill="#4CC9F0"/>
    <circle cx="600" cy="620" r="3.5" fill="#00D4A8" filter="url(#soft)"/>
    <circle cx="380" cy="375" r="3.5" fill="#4CC9F0"/>
    <circle cx="820" cy="375" r="3.5" fill="#7B61FF"/>
  </g>

  <!-- ============ AGENT LAB (floating) ============ -->
  <g>
    <rect x="520" y="18" width="160" height="52" rx="10" fill="#170E2E" stroke="#B967FF" stroke-width="1.5"/>
    <text x="600" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#E3C2FF">AGENT LAB</text>
    <circle cx="548" cy="52" r="6" fill="#B967FF"/><circle cx="576" cy="52" r="6" fill="none" stroke="#B967FF" stroke-width="1"/>
    <circle cx="630" cy="52" r="6" fill="#B967FF" opacity="0.5"/>
    <path d="M 520 70 C 540 84, 560 86, 600 86" fill="none" stroke="#B967FF" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  </g>

  <!-- ============ AI DISTRICT ============ -->
  <g>
    <rect x="320" y="150" width="560" height="120" rx="12" fill="#0E0820" stroke="#B967FF" stroke-width="1.5"/>
    <ellipse cx="600" cy="210" rx="200" ry="30" fill="#B967FF" opacity="0.12" filter="url(#glow)"/>
    <circle cx="600" cy="210" r="26" fill="#0B1220" stroke="#B967FF" stroke-width="1.5"/>
    <circle cx="600" cy="210" r="10" fill="#B967FF"/>
    <text x="600" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4" fill="#E3C2FF" font-weight="700">AI DISTRICT</text>
    <text x="600" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5" fill="#8B9BB4">LLMs · RAG · VECTOR SEARCH · AI AGENTS</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#B967FF">
      <text x="360" y="185">LLMs</text><text x="820" y="185">MULTI-AGENT</text><text x="360" y="240">EMBEDDINGS</text><text x="820" y="240">AI AGENTS</text>
    </g>
  </g>

  <!-- ============ WEB DISTRICT ============ -->
  <g>
    <rect x="150" y="310" width="300" height="130" rx="12" fill="#081522" stroke="#4CC9F0" stroke-width="1.5"/>
    <text x="300" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4" fill="#A9E7FF" font-weight="700">WEB DISTRICT</text>
    <text x="300" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5" fill="#8B9BB4">REACT · NEXT.JS · TS · TAILWIND</text>
    <ellipse cx="230" cy="408" rx="28" ry="10" fill="none" stroke="#4CC9F0" stroke-width="1" opacity="0.7"/>
    <ellipse cx="230" cy="408" rx="14" ry="5" fill="none" stroke="#4CC9F0" stroke-width="1" opacity="0.7"/>
    <rect x="340" y="396" width="40" height="24" fill="#0B1220" stroke="#4CC9F0" stroke-width="1"/>
    <text x="360" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#A9E7FF">NEXT</text>
  </g>

  <!-- ============ CHETHAN CORE ============ -->
  <g>
    <rect x="470" y="290" width="260" height="170" rx="12" fill="#0B1220" stroke="#4CC9F0" stroke-width="2"/>
    <rect x="480" y="300" width="240" height="150" rx="8" fill="#0E1B31"/>
    <ellipse cx="600" cy="360" rx="140" ry="50" fill="#4CC9F0" opacity="0.14" filter="url(#glow)"/>
    <text x="600" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="5" fill="#FFFFFF" font-weight="800">CHETHAN CORE</text>
    <text x="600" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2" fill="#64748B">ONE ENGINEER · MULTIPLE LAYERS</text>
    <circle cx="600" cy="396" r="22" fill="none" stroke="#4CC9F0" stroke-width="1.5"/>
    <circle cx="600" cy="396" r="8" fill="#4CC9F0"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#A9E7FF" text-anchor="middle">
      <text x="600" y="432">FULL-STACK</text>
      <text x="520" y="376">AI</text>
      <text x="680" y="376">BACKEND</text>
      <text x="600" y="452">SYSTEMS</text>
    </g>
  </g>

  <!-- ============ BACKEND DISTRICT ============ -->
  <g>
    <rect x="750" y="310" width="300" height="130" rx="12" fill="#0E0D24" stroke="#7B61FF" stroke-width="1.5"/>
    <text x="900" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4" fill="#C9BFFF" font-weight="700">BACKEND DISTRICT</text>
    <text x="900" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5" fill="#8B9BB4">NODE.JS · EXPRESS · FASTAPI</text>
    <rect x="800" y="392" width="16" height="26" fill="#0B1220" stroke="#7B61FF" stroke-width="1"/>
    <rect x="828" y="392" width="16" height="26" fill="#0B1220" stroke="#7B61FF" stroke-width="1"/>
    <rect x="856" y="392" width="16" height="26" fill="#0B1220" stroke="#7B61FF" stroke-width="1"/>
    <rect x="940" y="392" width="22" height="26" fill="#0B1220" stroke="#7B61FF" stroke-width="1"/>
    <text x="951" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#C9BFFF">REST</text>
  </g>

  <!-- ============ DATA DISTRICT ============ -->
  <g>
    <rect x="420" y="520" width="360" height="110" rx="12" fill="#04150F" stroke="#00D4A8" stroke-width="1.5"/>
    <text x="600" y="556" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4" fill="#7CFFDD" font-weight="700">DATA DISTRICT</text>
    <text x="600" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5" fill="#8B9BB4">POSTGRESQL · MONGODB · MYSQL · REDIS</text>
    <g>
      <ellipse cx="470" cy="604" rx="16" ry="5" fill="#00D4A8" opacity="0.3"/><circle cx="470" cy="600" r="12" fill="#0B1220" stroke="#00D4A8" stroke-width="1"/>
      <ellipse cx="530" cy="604" rx="16" ry="5" fill="#00D4A8" opacity="0.3"/><circle cx="530" cy="600" r="12" fill="#0B1220" stroke="#00D4A8" stroke-width="1"/>
      <ellipse cx="590" cy="604" rx="16" ry="5" fill="#00D4A8" opacity="0.3"/><circle cx="590" cy="600" r="12" fill="#0B1220" stroke="#00D4A8" stroke-width="1"/>
      <ellipse cx="650" cy="604" rx="16" ry="5" fill="#B967FF" opacity="0.3"/><circle cx="650" cy="600" r="12" fill="#0B1220" stroke="#B967FF" stroke-width="1"/>
      <ellipse cx="710" cy="604" rx="16" ry="5" fill="#B967FF" opacity="0.3"/><circle cx="710" cy="600" r="12" fill="#0B1220" stroke="#B967FF" stroke-width="1"/>
    </g>
  </g>

  <!-- ============ PROJECT DISTRICT ============ -->
  <g>
    <rect x="300" y="660" width="600" height="110" rx="12" fill="#0A1522" stroke="#4CC9F0" stroke-width="1.5"/>
    <text x="600" y="692" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4" fill="#A9E7FF" font-weight="700">PROJECT DISTRICT</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.5" fill="#A9E7FF" text-anchor="middle">
      <rect x="330" y="706" width="70" height="30" fill="#0B1220" stroke="#4CC9F0" stroke-width="1"/><text x="365" y="726">SARA</text>
      <rect x="415" y="706" width="70" height="30" fill="#0B1220" stroke="#B967FF" stroke-width="1"/><text x="450" y="726" fill="#E3C2FF">SENTINEL</text>
      <rect x="500" y="706" width="70" height="30" fill="#0B1220" stroke="#22D3EE" stroke-width="1"/><text x="535" y="726" fill="#7BE3FF">MEDFLOW</text>
      <rect x="585" y="706" width="70" height="30" fill="#0B1220" stroke="#00D4A8" stroke-width="1"/><text x="620" y="726" fill="#7CFFDD">SPENDWISE</text>
      <rect x="670" y="706" width="70" height="30" fill="#0B1220" stroke="#4CC9F0" stroke-width="1" opacity="0.5"/><text x="705" y="726" fill="#8B9BB4">+ MORE</text>
    </g>
  </g>

  <!-- ============ ARCHIVE ============ -->
  <g>
    <rect x="150" y="800" width="360" height="70" rx="12" fill="#0B1220" stroke="#4CC9F0" stroke-width="1.5"/>
    <text x="330" y="832" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" fill="#A9E7FF" font-weight="700">THE ARCHIVE</text>
    <text x="330" y="850" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.5" letter-spacing="1.5" fill="#64748B">ACHIEVEMENTS · MILESTONES</text>
    <rect x="180" y="816" width="8" height="8" fill="#B967FF"/><rect x="196" y="816" width="8" height="8" fill="#00D4A8"/><rect x="212" y="816" width="8" height="8" fill="#4CC9F0"/>
  </g>

  <!-- ============ HORIZON ============ -->
  <g>
    <rect x="690" y="800" width="360" height="70" rx="12" fill="#0A0620" stroke="#7B61FF" stroke-width="1.5"/>
    <ellipse cx="870" cy="835" rx="80" ry="16" fill="#7B61FF" opacity="0.25" filter="url(#glow)"/>
    <text x="870" y="830" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" fill="#C9BFFF" font-weight="700">NEXT HORIZON</text>
    <text x="870" y="850" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2" fill="#8B9BB4">SDE / SOFTWARE ENGINEER</text>
  </g>

  <!-- compass -->
  <g transform="translate(80,80)">
    <circle cx="0" cy="0" r="28" fill="#0B1220" stroke="#2A3A55" stroke-width="1"/>
    <polygon points="0,-18 4,0 0,6 -4,0" fill="#4CC9F0"/>
    <polygon points="0,18 4,0 0,-6 -4,0" fill="#2A3A55"/>
    <text x="0" y="-34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748B">N</text>
  </g>

  <text x="600" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="10" fill="#FFFFFF">CHETHANVERSE — CITY MAP</text>
  <text x="600" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#64748B">TOP-DOWN SYSTEMS VIEW</text>
</svg>