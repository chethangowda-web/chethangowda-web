<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060C"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </linearGradient>
    <linearGradient id="terminalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111C30"/>
      <stop offset="50%" stop-color="#16243D"/>
      <stop offset="100%" stop-color="#111C30"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#0D1524" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.4"/>

  <!-- terminal body -->
  <rect x="150" y="70" width="900" height="190" rx="14" fill="url(#terminalGrad)" stroke="#2A3A55" stroke-width="1.5"/>
  <line x1="150" y1="104" x2="1050" y2="104" stroke="#2A3A55" stroke-width="1"/>
  <!-- header -->
  <text x="600" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="6" fill="#4CC9F0">EXIT TERMINAL</text>
  <circle cx="180" cy="86" r="4" fill="#00D4A8"/><circle cx="198" cy="86" r="4" fill="#00D4A8" opacity="0.5"/>
  <text x="600" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="url(#titleGrad)">LEAVE THE CITY</text>
  <text x="600" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="4" fill="#64748B">FIND ME OUTSIDE THE WALLS</text>

  <!-- portals -->
  <g>
    <ellipse cx="300" cy="222" rx="90" ry="16" fill="url(#portalGlow)" filter="url(#glow)"/>
    <rect x="230" y="190" width="140" height="40" rx="8" fill="#0B1220" stroke="#4CC9F0" stroke-width="1.5"/>
    <circle cx="258" cy="210" r="9" fill="none" stroke="#4CC9F0" stroke-width="1.5"/>
    <circle cx="258" cy="210" r="3.5" fill="#4CC9F0"/>
    <text x="282" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#A9E7FF" font-weight="700">GITHUB</text>

    <ellipse cx="600" cy="222" rx="90" ry="16" fill="url(#portalGlow)" filter="url(#glow)"/>
    <rect x="530" y="190" width="140" height="40" rx="8" fill="#0B1220" stroke="#7B61FF" stroke-width="1.5"/>
    <rect x="552" y="200" width="12" height="20" fill="none" stroke="#7B61FF" stroke-width="1.5"/>
    <text x="582" y="215" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#C9BFFF" font-weight="700">LINKEDIN</text>

    <ellipse cx="900" cy="222" rx="90" ry="16" fill="url(#portalGlow)" filter="url(#glow)"/>
    <rect x="830" y="190" width="140" height="40" rx="8" fill="#0B1220" stroke="#22D3EE" stroke-width="1.5"/>
    <path d="M 858 200 L 870 200 L 870 222 L 858 222 Z" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="882" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#7BE3FF" font-weight="700">EMAIL</text>
  </g>

  <!-- scanning beams -->
  <g stroke="#4CC9F0" stroke-width="1" opacity="0.3">
    <line x1="150" y1="260" x2="1050" y2="260"/>
  </g>
  <circle cx="600" cy="282" r="4" fill="#4CC9F0" opacity="0.7"/>
  <circle cx="600" cy="282" r="8" fill="none" stroke="#4CC9F0" stroke-width="1" opacity="0.4"/>

  <text x="600" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="4" fill="#64748B">CHETHANVERSE · ENGINEERING LAB · 2026</text>
</svg>