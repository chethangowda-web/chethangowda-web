<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060C"/>
      <stop offset="100%" stop-color="#0A0D18"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B2B47"/>
      <stop offset="50%" stop-color="#141F38"/>
      <stop offset="100%" stop-color="#101B31"/>
    </linearGradient>
    <linearGradient id="archRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4470"/>
      <stop offset="100%" stop-color="#16243D"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#0D1524" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="floatShadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="600" cy="400" rx="540" ry="55" fill="url(#glowCyan)" filter="url(#glow)"/>

  <!-- THE ARCHIVE building -->
  <g filter="url(#floatShadow)">
    <path d="M 400 300 L 400 120 Q 400 60 470 60 L 730 60 Q 800 60 800 120 L 800 300 Z" fill="url(#archRoof)" stroke="#4CC9F0" stroke-width="1.5"/>
    <rect x="400" y="300" width="400" height="90" fill="url(#archGrad)" stroke="#4CC9F0" stroke-width="1.5"/>
    <!-- columns -->
    <rect x="430" y="60" width="16" height="300" fill="#0A1120"/>
    <rect x="510" y="60" width="16" height="300" fill="#0A1120"/>
    <rect x="674" y="60" width="16" height="300" fill="#0A1120"/>
    <rect x="754" y="60" width="16" height="300" fill="#0A1120"/>
    <!-- entrance -->
    <path d="M 555 390 L 555 340 Q 555 310 600 310 Q 645 310 645 340 L 645 390 Z" fill="#05080F" stroke="#4CC9F0" stroke-width="1.5"/>
    <circle cx="640" cy="336" r="3" fill="#4CC9F0"/>
    <!-- archive glow from entrance -->
    <ellipse cx="600" cy="382" rx="50" ry="8" fill="#4CC9F0" opacity="0.5" filter="url(#soft)"/>
    <!-- engraving -->
    <text x="600" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="6" fill="#FFFFFF" font-weight="800">THE ARCHIVE</text>
    <text x="600" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="4" fill="#64748B">MILESTONES · HACKATHONS · BUILDS</text>
    <!-- holo badges beside entrance -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="470" y="330" width="52" height="18" rx="4" fill="#0B1220" stroke="#00D4A8" stroke-width="1"/>
      <text x="496" y="343" text-anchor="middle" font-size="9" letter-spacing="1" fill="#7CFFDD">ACTIVE</text>
      <rect x="680" y="330" width="52" height="18" rx="4" fill="#0B1220" stroke="#B967FF" stroke-width="1"/>
      <text x="706" y="343" text-anchor="middle" font-size="9" letter-spacing="1" fill="#E3C2FF">SHIPPER</text>
    </g>
  </g>

  <!-- holographic achievement badges -->
  <g>
    <!-- badge 1: HiDevs round 2 -->
    <g filter="url(#floatShadow)">
      <rect x="60" y="120" width="270" height="90" rx="8" fill="#0B1220" stroke="#B967FF" stroke-width="1.2"/>
      <rect x="76" y="136" width="34" height="34" rx="6" fill="#B967FF" opacity="0.2"/>
      <path d="M 93 142 L 100 162 L 93 172 L 86 162 Z" fill="#B967FF"/>
      <text x="124" y="152" font-size="12" letter-spacing="1" fill="#E3C2FF" font-weight="700">ROUND 2 FINALIST</text>
      <text x="124" y="168" font-size="9.5" fill="#8B9BB4">HiDevs × Mastra AI Agent</text>
      <text x="124" y="182" font-size="9.5" fill="#8B9BB4">Builder Hackathon</text>
    </g>

    <!-- badge 2: Top 25 volunteer -->
    <g filter="url(#floatShadow)">
      <rect x="60" y="240" width="270" height="90" rx="8" fill="#0B1220" stroke="#4CC9F0" stroke-width="1.2"/>
      <rect x="76" y="256" width="34" height="34" rx="6" fill="#4CC9F0" opacity="0.2"/>
      <path d="M 93 262 L 104 270 L 100 286 L 86 286 L 82 270 Z" fill="#4CC9F0"/>
      <text x="124" y="272" font-size="12" letter-spacing="1" fill="#A9E7FF" font-weight="700">TOP 25 VOLUNTEER</text>
      <text x="124" y="288" font-size="9.5" fill="#8B9BB4">AI Agent Builder Series 2026</text>
      <text x="124" y="302" font-size="9.5" fill="#8B9BB4">Community Build Series</text>
    </g>

    <!-- badge 3: MedFlow -->
    <g filter="url(#floatShadow)">
      <rect x="870" y="120" width="270" height="90" rx="8" fill="#0B1220" stroke="#22D3EE" stroke-width="1.2"/>
      <rect x="886" y="136" width="34" height="34" rx="6" fill="#22D3EE" opacity="0.2"/>
      <path d="M 903 136 Q 906 148 900 156 Q 906 164 903 176 L 895 172 L 885 176 Q 888 164 882 156 Q 888 148 885 136 L 893 140 Z" fill="#22D3EE"/>
      <text x="934" y="152" font-size="12" letter-spacing="1" fill="#7BE3FF" font-weight="700">HEALTHTECH BUILDER</text>
      <text x="934" y="168" font-size="9.5" fill="#8B9BB4">MedFlow AI — Gemini · RAG ·</text>
      <text x="934" y="182" font-size="9.5" fill="#8B9BB4">MCP · Multi-Agent System</text>
    </g>

    <!-- badge 4: SARA civic tech -->
    <g filter="url(#floatShadow)">
      <rect x="870" y="240" width="270" height="90" rx="8" fill="#0B1220" stroke="#00D4A8" stroke-width="1.2"/>
      <rect x="886" y="256" width="34" height="34" rx="6" fill="#00D4A8" opacity="0.2"/>
      <path d="M 903 256 L 916 260 L 912 274 L 903 290 L 894 274 L 890 260 Z" fill="#00D4A8"/>
      <text x="934" y="272" font-size="12" letter-spacing="1" fill="#7CFFDD" font-weight="700">CIVIC-TECH</text>
      <text x="934" y="288" font-size="9.5" fill="#8B9BB4">SARA — Smart Accountability</text>
      <text x="934" y="302" font-size="9.5" fill="#8B9BB4">&amp; Resolution Assistant</text>
    </g>
  </g>

  <text x="600" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#64748B">REAL MILESTONES — STORED IN THE CITY'S ARCHIVE</text>
</svg>