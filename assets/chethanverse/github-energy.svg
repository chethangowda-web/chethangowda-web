<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060C"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#7B61FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- ============ CONTRIBUTION GRID (bottom) ============ -->
  <g transform="translate(250,260)">
    <g fill="#0F1B30">
      <rect x="0" y="0" width="9" height="9"/><rect x="12" y="0" width="9" height="9"/><rect x="24" y="0" width="9" height="9"/>
      <rect x="36" y="0" width="9" height="9"/><rect x="48" y="0" width="9" height="9"/><rect x="60" y="0" width="9" height="9"/>
      <rect x="0" y="12" width="9" height="9"/><rect x="12" y="12" width="9" height="9"/><rect x="24" y="12" width="9" height="9"/>
      <rect x="36" y="12" width="9" height="9"/><rect x="48" y="12" width="9" height="9"/><rect x="60" y="12" width="9" height="9"/>
      <rect x="0" y="24" width="9" height="9"/><rect x="12" y="24" width="9" height="9"/><rect x="24" y="24" width="9" height="9"/>
      <rect x="36" y="24" width="9" height="9"/><rect x="48" y="24" width="9" height="9"/><rect x="60" y="24" width="9" height="9"/>
    </g>
    <!-- lit cells (energy) -->
    <g>
      <rect x="0" y="12" width="9" height="9" fill="#00A37A"/>
      <rect x="12" y="0" width="9" height="9" fill="#00A37A"/><rect x="12" y="24" width="9" height="9" fill="#00D4A8"/>
      <rect x="24" y="12" width="9" height="9" fill="#00D4A8"/>
      <rect x="36" y="0" width="9" height="9" fill="#00A37A"/><rect x="36" y="12" width="9" height="9" fill="#00D4A8"/><rect x="36" y="24" width="9" height="9" fill="#00A37A"/>
      <rect x="48" y="12" width="9" height="9" fill="#00D4A8"/>
      <rect x="60" y="0" width="9" height="9" fill="#00D4A8"/><rect x="60" y="24" width="9" height="9" fill="#00D4A8"/>
    </g>
  </g>
  <text x="300" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#64748B">GITHUB CONTRIBUTIONS</text>

  <!-- ============ ENERGY FLOW to core ============ -->
  <g fill="none" stroke="#00D4A8" stroke-width="2" opacity="0.8">
    <path d="M 360 280 C 420 220, 460 200, 540 180"/>
    <path d="M 380 300 C 440 250, 500 220, 550 190"/>
  </g>
  <g fill="#00D4A8">
    <circle cx="420" cy="235" r="4" filter="url(#soft)"/><circle cx="470" cy="210" r="3"/>
  </g>

  <!-- ============ ENERGY CORE ============ -->
  <g>
    <ellipse cx="600" cy="150" rx="120" ry="60" fill="url(#coreGlow)" filter="url(#glow)"/>
    <circle cx="600" cy="150" r="46" fill="#0B1220" stroke="#4CC9F0" stroke-width="2"/>
    <circle cx="600" cy="150" r="28" fill="none" stroke="#7B61FF" stroke-width="1.5" opacity="0.7"/>
    <circle cx="600" cy="150" r="14" fill="#4CC9F0"/>
    <circle cx="600" cy="150" r="22" fill="none" stroke="#7BE3FF" stroke-width="1" opacity="0.8"/>
  </g>
  <text x="600" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#A9E7FF">ENERGY CORE</text>

  <!-- ============ DISTRICTS LIGHT UP ============ -->
  <g fill="none" stroke-width="1.5" opacity="0.7">
    <path d="M 556 130 C 480 110, 380 100, 210 90" stroke="#B967FF"/>
    <path d="M 556 140 C 470 150, 380 150, 210 180" stroke="#00D4A8"/>
    <path d="M 644 130 C 720 110, 820 100, 990 90" stroke="#4CC9F0"/>
    <path d="M 644 140 C 730 150, 820 150, 990 180" stroke="#7B61FF"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">
    <circle cx="210" cy="90" r="5" fill="#B967FF"/><text x="228" y="94" fill="#B967FF">AI</text>
    <circle cx="210" cy="180" r="5" fill="#00D4A8"/><text x="228" y="184" fill="#00D4A8">DATA</text>
    <circle cx="990" cy="90" r="5" fill="#4CC9F0"/><text x="1002" y="94" fill="#4CC9F0">WEB</text>
    <circle cx="990" cy="180" r="5" fill="#7B61FF"/><text x="1002" y="184" fill="#7B61FF">BACKEND</text>
    <circle cx="600" cy="280" r="5" fill="#7BE3FF"/><text x="616" y="284" fill="#A9E7FF">PROJECTS</text>
  </g>

  <text x="600" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="8" fill="url(#titleGrad)">CITY ENERGY</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#64748B">EVERY CONTRIBUTION POWERS THE CITY</text>
</svg>