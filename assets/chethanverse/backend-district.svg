<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060C"/>
      <stop offset="100%" stop-color="#0A0A16"/>
    </linearGradient>
    <linearGradient id="rackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A1A3E"/>
      <stop offset="50%" stop-color="#141438"/>
      <stop offset="100%" stop-color="#0F0F30"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#0E0E1F" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="600" cy="330" rx="520" ry="60" fill="url(#glowBlue)" filter="url(#glow)"/>

  <!-- REQUEST HIGHWAY (left) -->
  <g stroke="#7B61FF" stroke-width="1.5" opacity="0.7">
    <path d="M 30 160 L 190 160"/>
    <path d="M 30 180 L 190 180"/>
  </g>
  <g fill="#7B61FF">
    <circle cx="60" cy="160" r="4"/><circle cx="120" cy="180" r="4"/><circle cx="90" cy="160" r="3"/>
    <circle cx="150" cy="180" r="3"/><circle cx="60" cy="180" r="3"/>
  </g>
  <text x="30" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#7B61FF">REQUESTS</text>

  <!-- LOAD BALANCER -->
  <g>
    <rect x="230" y="130" width="130" height="46" rx="6" fill="#0B1220" stroke="#7B61FF" stroke-width="1.5"/>
    <text x="295" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#C9BFFF">LOAD</text>
    <text x="295" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#C9BFFF">BALANCER</text>
    <circle cx="240" cy="150" r="3" fill="#7B61FF"/><circle cx="352" cy="150" r="3" fill="#7B61FF"/>
  </g>

  <!-- API pipelines to server racks -->
  <g stroke="#7B61FF" stroke-width="1.5" opacity="0.6">
    <path d="M 360 148 L 470 148"/>
    <path d="M 360 158 L 470 178"/>
    <path d="M 360 168 L 470 208"/>
  </g>

  <!-- SERVER RACKS -->
  <g>
    <g fill="url(#rackGrad)" stroke="#7B61FF" stroke-width="1">
      <rect x="470" y="120" width="120" height="220"/>
      <rect x="610" y="150" width="120" height="190"/>
      <rect x="750" y="130" width="120" height="210"/>
    </g>
    <g fill="none" stroke="#0A0A1C" stroke-width="1">
      <line x1="470" y1="168" x2="590" y2="168"/><line x1="470" y1="196" x2="590" y2="196"/>
      <line x1="470" y1="224" x2="590" y2="224"/><line x1="470" y1="252" x2="590" y2="252"/>
      <line x1="470" y1="280" x2="590" y2="280"/>
      <line x1="610" y1="190" x2="730" y2="190"/><line x1="610" y1="230" x2="730" y2="230"/><line x1="610" y1="270" x2="730" y2="270"/>
      <line x1="750" y1="172" x2="870" y2="172"/><line x1="750" y1="214" x2="870" y2="214"/><line x1="750" y1="256" x2="870" y2="256"/>
    </g>
    <!-- rack status lights -->
    <g>
      <circle cx="490" cy="155" r="3" fill="#00D4A8"/><circle cx="490" cy="183" r="3" fill="#00D4A8"/><circle cx="490" cy="211" r="3" fill="#7B61FF"/>
      <circle cx="490" cy="239" r="3" fill="#00D4A8"/><circle cx="490" cy="267" r="3" fill="#00D4A8"/>
      <circle cx="630" cy="176" r="3" fill="#00D4A8"/><circle cx="630" cy="216" r="3" fill="#00D4A8"/><circle cx="630" cy="256" r="3" fill="#7B61FF"/>
      <circle cx="770" cy="158" r="3" fill="#00D4A8"/><circle cx="770" cy="200" r="3" fill="#7B61FF"/><circle cx="770" cy="242" r="3" fill="#00D4A8"/>
    </g>
  </g>

  <!-- RESPONSE OUT (right) -->
  <g stroke="#00D4A8" stroke-width="1.5" opacity="0.7">
    <path d="M 870 190 L 1030 190"/>
    <path d="M 870 210 L 1030 210"/>
  </g>
  <g fill="#00D4A8">
    <circle cx="930" cy="190" r="4"/><circle cx="980" cy="210" r="4"/><circle cx="1010" cy="190" r="3"/>
  </g>
  <text x="1030" y="170" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#00D4A8">RESPONSES</text>

  <!-- stack labels -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="530" y="105" font-size="12" letter-spacing="2" fill="#C9BFFF">NODE.JS</text>
    <text x="670" y="128" font-size="12" letter-spacing="2" fill="#C9BFFF">EXPRESS</text>
    <text x="810" y="115" font-size="12" letter-spacing="2" fill="#C9BFFF">FASTAPI</text>
    <text x="600" y="388" font-size="11" letter-spacing="4" fill="#64748B">REST API PIPELINE — REQUEST → PROCESS → RESPONSE</text>
  </g>

  <text x="600" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="url(#titleGrad)">BACKEND DISTRICT</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#64748B">API PROCESSING PLANTS</text>
</svg>