  </g>

  <!-- ============ SENTINELFLOW (security tower, right) ============ -->
  <g>
    <ellipse cx="840" cy="600" rx="150" ry="22" fill="#B967FF" opacity="0.18" filter="url(#glow)"/>
    <rect x="740" y="240" width="200" height="320" fill="url(#sentGrad)" stroke="#B967FF" stroke-width="1.4"/>
    <line x1="800" y1="240" x2="800" y2="560" stroke="#0F0D26" stroke-width="1"/>
    <line x1="860" y1="240" x2="860" y2="560" stroke="#0F0D26" stroke-width="1"/>
    <g stroke="#B967FF" stroke-width="1">
      <line x1="740" y1="300" x2="940" y2="300" opacity="0.4"/>
      <line x1="740" y1="370" x2="940" y2="370" opacity="0.4"/>
      <line x1="740" y1="440" x2="940" y2="440" opacity="0.4"/>
      <line x1="740" y1="510" x2="940" y2="510" opacity="0.4"/>
    </g>
    <g fill="#D8A9FF">
      <rect x="752" y="258" width="8" height="6"/><rect x="820" y="258" width="8" height="6"/><rect x="880" y="258" width="8" height="6"/>
      <rect x="752" y="318" width="8" height="6"/><rect x="880" y="318" width="8" height="6"/>
      <rect x="820" y="388" width="8" height="6"/><rect x="752" y="458" width="8" height="6"/><rect x="880" y="458" width="8" height="6"/>
    </g>
    <!-- radar dish -->
    <line x1="840" y1="240" x2="840" y2="210" stroke="#B967FF" stroke-width="2"/>
    <circle cx="840" cy="208" r="4" fill="#D8A9FF"/>
    <circle cx="840" cy="208" r="10" fill="none" stroke="#B967FF" stroke-width="1" opacity="0.5"/>
    <text x="840" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3" fill="#FFFFFF" font-weight="800">SENTINELFLOW</text>
    <!-- incident timeline -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">
      <circle cx="752" cy="560" r="3" fill="#B967FF"/><text x="766" y="564" fill="#D8A9FF">EVENT</text>
      <line x1="800" y1="560" x2="820" y2="560" stroke="#B967FF" stroke-width="1.2" opacity="0.6"/>
      <circle cx="838" cy="560" r="3" fill="#B967FF"/><text x="852" y="564" fill="#D8A9FF">DETECT</text>
      <line x1="886" y1="560" x2="860" y2="560" stroke="#B967FF" stroke-width="1.2" opacity="0.6"/>
      <circle cx="876" cy="534" r="3" fill="#B967FF"/><text x="888" y="538" fill="#D8A9FF">ANALYZE</text>
      <line x1="900" y1="520" x2="916" y2="496" stroke="#B967FF" stroke-width="1.2" opacity="0.6"/>
      <circle cx="930" cy="488" r="3" fill="#B967FF"/><text x="938" y="492" fill="#D8A9FF">RESPOND</text>
      <circle cx="948" cy="452" r="3" fill="#B967FF" opacity="0.6"/><text x="954" y="456" fill="#C9BFFF" opacity="0.8">POST-MORTEM</text>
    </g>
    <text x="840" y="596" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing="1" fill="#D8A9FF">AI INCIDENT RESPONSE &amp; POST-MORTEM AGENT</text>
    <text x="840" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1" fill="#64748B">TypeScript · Node.js · Mastra · Groq</text>
  </g>

  <!-- ============ MEDFLOW (medical tower, far right) ============ -->
  <g>
    <ellipse cx="1060" cy="600" rx="140" ry="22" fill="#22D3EE" opacity="0.18" filter="url(#glow)"/>
    <!-- holographic rings -->
    <g opacity="0.5">
      <ellipse cx="1060" cy="360" rx="90" ry="26" fill="none" stroke="#22D3EE" stroke-width="1"/>
      <ellipse cx="1060" cy="360" rx="60" ry="18" fill="none" stroke="#4CC9F0" stroke-width="1"/>
    </g>
    <rect x="970" y="230" width="180" height="330" fill="url(#medGrad)" stroke="#22D3EE" stroke-width="1.4"/>
    <line x1="1015" y1="230" x2="1015" y2="560" stroke="#0A1A2C" stroke-width="1"/>
    <line x1="1060" y1="230" x2="1060" y2="560" stroke="#0A1A2C" stroke-width="1"/>
    <line x1="1105" y1="230" x2="1105" y2="560" stroke="#0A1A2C" stroke-width="1"/>
    <!-- central orchestration core -->
    <circle cx="1060" cy="360" r="26" fill="#0B1220" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="1060" cy="360" r="12" fill="#22D3EE"/>
    <circle cx="1060" cy="360" r="18" fill="none" stroke="#7BE3FF" stroke-width="1" opacity="0.7"/>
    <!-- patient agents orbiting -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="0.5">
      <circle cx="1040" cy="290" r="12" fill="#0B1220" stroke="#22D3EE" stroke-width="1"/><text x="1040" y="293" text-anchor="middle" fill="#7BE3FF">INTAKE</text>
      <circle cx="1095" cy="320" r="12" fill="#0B1220" stroke="#22D3EE" stroke-width="1"/><text x="1095" y="323" text-anchor="middle" fill="#7BE3FF">HISTORY</text>
      <circle cx="1105" cy="400" r="12" fill="#0B1220" stroke="#22D3EE" stroke-width="1"/><text x="1105" y="403" text-anchor="middle" fill="#7BE3FF">RISK</text>
      <circle cx="1060" cy="438" r="12" fill="#0B1220" stroke="#22D3EE" stroke-width="1"/><text x="1060" y="441" text-anchor="middle" fill="#7BE3FF">LABS</text>
      <circle cx="1005" cy="405" r="12" fill="#0B1220" stroke="#22D3EE" stroke-width="1"/><text x="1005" y="408" text-anchor="middle" fill="#7BE3FF">TREAT</text>
      <circle cx="990" cy="320" r="12" fill="#0B1220" stroke="#22D3EE" stroke-width="1"/><text x="990" y="323" text-anchor="middle" fill="#7BE3FF">MEDS</text>
      <circle cx="1040" cy="200" r="12" fill="#0B1220" stroke="#4CC9F0" stroke-width="1"/><text x="1040" y="203" text-anchor="middle" fill="#A9E7FF">DISCHARGE</text>
      <circle cx="1090" cy="200" r="12" fill="#0B1220" stroke="#4CC9F0" stroke-width="1"/><text x="1090" y="203" text-anchor="middle" fill="#A9E7FF">FOLLOW-UP</text>
    </g>
    <!-- agent connections -->
    <g stroke="#22D3EE" stroke-width="1" opacity="0.5">
      <path d="M 1046 336 L 1042 302"/><path d="M 1080 340 L 1088 332"/><path d="M 1084 380 L 1098 394"/>
      <path d="M 1060 386 L 1060 426"/><path d="M 1034 380 L 1012 398"/><path d="M 1024 352 L 998 332"/>
    </g>
    <text x="1060" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3" fill="#FFFFFF" font-weight="800">MEDFLOW AI</text>
    <text x="1060" y="596" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing="1" fill="#7BE3FF">HOLOGRAPHIC HEALTH ORCHESTRATION</text>
    <text x="1060" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1" fill="#64748B">Gemini · RAG · MCP · Multi-Agent</text>
  </g>

  <!-- district connectors -->
  <g stroke="#2A3A55" stroke-width="1" opacity="0.6">
    <path d="M 240 500 L 340 460"/>
    <path d="M 600 460 L 740 430"/>
    <path d="M 940 460 L 970 440"/>
  </g>
</svg>