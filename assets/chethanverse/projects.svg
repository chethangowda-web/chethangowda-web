<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060C"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </linearGradient>
    <linearGradient id="saraGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B2B47"/>
      <stop offset="50%" stop-color="#16243D"/>
      <stop offset="100%" stop-color="#101B31"/>
    </linearGradient>
    <linearGradient id="sentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A1238"/>
      <stop offset="50%" stop-color="#141034"/>
      <stop offset="100%" stop-color="#0F0D2C"/>
    </linearGradient>
    <linearGradient id="medGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E2740"/>
      <stop offset="50%" stop-color="#0C2138"/>
      <stop offset="100%" stop-color="#0A1A2C"/>
    </linearGradient>
    <linearGradient id="spendGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E2E26"/>
      <stop offset="50%" stop-color="#0B2620"/>
      <stop offset="100%" stop-color="#081C18"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B967FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B967FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="medHolo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#0D1524" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="600" cy="590" rx="560" ry="60" fill="url(#glowCyan)" filter="url(#glow)"/>
  <ellipse cx="300" cy="520" rx="220" ry="50" fill="url(#glowPurple)" filter="url(#glow)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="url(#titleGrad)">PROJECT DISTRICT</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#64748B">FOUR BUILT WORLDS</text>

  <!-- ============ SPENDWISE (small fintech, left) ============ -->
  <g>
    <ellipse cx="150" cy="600" rx="110" ry="20" fill="#00D4A8" opacity="0.15" filter="url(#glow)"/>
    <rect x="60" y="360" width="180" height="180" fill="url(#spendGrad)" stroke="#00D4A8" stroke-width="1.2"/>
    <!-- mini bar graph -->
    <g fill="#00D4A8" opacity="0.9">
      <rect x="80" y="470" width="14" height="50"/><rect x="102" y="450" width="14" height="70"/>
      <rect x="124" y="475" width="14" height="45"/><rect x="146" y="425" width="14" height="95"/>
      <rect x="168" y="440" width="14" height="80"/><rect x="190" y="455" width="14" height="65"/>
    </g>
    <path d="M 80 465 L 116 435 L 138 450 L 160 400 L 204 415" fill="none" stroke="#7CFFDD" stroke-width="2"/>
    <circle cx="160" cy="400" r="4" fill="#7CFFDD"/>
    <text x="150" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#00D4A8" font-weight="700">SPENDWISE</text>
    <text x="150" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1" fill="#7CFFDD">TRANSACTION STREAMS</text>
    <!-- transaction stream -->
    <g stroke="#00D4A8" stroke-width="1" opacity="0.6">
      <path d="M 60 385 L 20 385"/><path d="M 60 405 L 20 405"/>
    </g>
    <circle cx="35" cy="385" r="2.5" fill="#00D4A8"/><circle cx="42" cy="405" r="2.5" fill="#00D4A8"/>
    <text x="150" y="632" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1" fill="#64748B">React · Firebase · Chart.js</text>
  </g>

  <!-- ============ SARA (largest, civic tower, center) ============ -->
  <g>
    <ellipse cx="470" cy="600" rx="200" ry="25" fill="#4CC9F0" opacity="0.18" filter="url(#glow)"/>
    <rect x="340" y="180" width="260" height="380" fill="url(#saraGrad)" stroke="#4CC9F0" stroke-width="1.5"/>
    <line x1="400" y1="180" x2="400" y2="560" stroke="#0C1626" stroke-width="1"/>
    <line x1="460" y1="180" x2="460" y2="560" stroke="#0C1626" stroke-width="1"/>
    <line x1="520" y1="180" x2="520" y2="560" stroke="#0C1626" stroke-width="1"/>
    <!-- civic floors -->
    <g stroke="#4CC9F0" stroke-width="1">
      <line x1="340" y1="230" x2="600" y2="230" opacity="0.4"/>
      <line x1="340" y1="290" x2="600" y2="290" opacity="0.4"/>
      <line x1="340" y1="350" x2="600" y2="350" opacity="0.4"/>
      <line x1="340" y1="410" x2="600" y2="410" opacity="0.4"/>
      <line x1="340" y1="470" x2="600" y2="470" opacity="0.4"/>
      <line x1="340" y1="530" x2="600" y2="530" opacity="0.4"/>
    </g>
    <!-- glowing windows -->
    <g fill="#7BE3FF">
      <rect x="352" y="196" width="9" height="6"/><rect x="470" y="196" width="9" height="6"/><rect x="560" y="196" width="9" height="6"/>
      <rect x="410" y="244" width="9" height="6"/><rect x="520" y="244" width="9" height="6"/>
      <rect x="352" y="300" width="9" height="6"/><rect x="470" y="300" width="9" height="6"/>
      <rect x="410" y="360" width="9" height="6"/><rect x="560" y="360" width="9" height="6"/>
      <rect x="352" y="424" width="9" height="6"/><rect x="520" y="424" width="9" height="6"/>
    </g>
    <!-- flag / emblem -->
    <line x1="470" y1="180" x2="470" y2="150" stroke="#4CC9F0" stroke-width="2"/>
    <rect x="470" y="150" width="26" height="14" fill="#4CC9F0" opacity="0.9"/>
    <text x="470" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4" fill="#FFFFFF" font-weight="800">SARA</text>
    <text x="470" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="1.5" fill="#A9E7FF">CIVIC TOWER</text>
    <!-- accountability flow (left of tower) -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">
      <g>
        <rect x="280" y="200" width="52" height="22" fill="#0B1220" stroke="#4CC9F0" stroke-width="1"/>
        <text x="306" y="214" text-anchor="middle" fill="#A9E7FF">CITIZEN</text>
        <line x1="306" y1="222" x2="306" y2="240" stroke="#4CC9F0" stroke-width="1.5"/>
        <polygon points="302,240 310,240 306,247" fill="#4CC9F0"/>
      </g>
      <g>
        <rect x="280" y="252" width="52" height="22" fill="#0B1220" stroke="#4CC9F0" stroke-width="1"/>
        <text x="306" y="266" text-anchor="middle" fill="#A9E7FF">GRIEVANCE</text>
        <line x1="306" y1="274" x2="306" y2="292" stroke="#4CC9F0" stroke-width="1.5"/>
        <polygon points="302,292 310,292 306,299" fill="#4CC9F0"/>
      </g>
      <g>
        <rect x="280" y="304" width="52" height="22" fill="#0B1220" stroke="#B967FF" stroke-width="1"/>
        <text x="306" y="318" text-anchor="middle" fill="#E3C2FF">AI</text>
        <line x1="306" y1="326" x2="306" y2="344" stroke="#B967FF" stroke-width="1.5"/>
        <polygon points="302,344 310,344 306,351" fill="#B967FF"/>
      </g>
      <g>
        <rect x="280" y="356" width="52" height="22" fill="#0B1220" stroke="#4CC9F0" stroke-width="1"/>
        <text x="306" y="370" text-anchor="middle" fill="#A9E7FF">ACCOUNT</text>
        <line x1="306" y1="378" x2="306" y2="396" stroke="#4CC9F0" stroke-width="1.5"/>
        <polygon points="302,396 310,396 306,403" fill="#4CC9F0"/>
      </g>
      <g>
        <rect x="280" y="408" width="52" height="22" fill="#0B1220" stroke="#7B61FF" stroke-width="1"/>
        <text x="306" y="422" text-anchor="middle" fill="#C9BFFF">ESCALATE</text>
        <line x1="306" y1="430" x2="306" y2="448" stroke="#7B61FF" stroke-width="1.5"/>
        <polygon points="302,448 310,448 306,455" fill="#7B61FF"/>
      </g>
      <g>
        <rect x="280" y="460" width="52" height="22" fill="#0B1220" stroke="#00D4A8" stroke-width="1"/>
        <text x="306" y="474" text-anchor="middle" fill="#7CFFDD">RESOLVE</text>
      </g>
    </g>
    <text x="470" y="596" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing="1" fill="#A9E7FF">SMART ACCOUNTABILITY &amp; RESOLUTION ASSISTANT</text>
