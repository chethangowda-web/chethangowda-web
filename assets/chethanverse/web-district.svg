<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060C"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16263E"/>
      <stop offset="50%" stop-color="#0E1C34"/>
      <stop offset="100%" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="darkTower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06080F"/>
      <stop offset="60%" stop-color="#0A0E18"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#0D1524" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="600" cy="330" rx="520" ry="60" fill="url(#glowCyan)" filter="url(#glow)"/>

  <!-- React orbital structure (left) -->
  <g transform="translate(260,220)">
    <ellipse rx="110" ry="40" fill="none" stroke="#4CC9F0" stroke-width="1.2" opacity="0.8" transform="rotate(-20)"/>
    <ellipse rx="110" ry="40" fill="none" stroke="#4CC9F0" stroke-width="1.2" opacity="0.8" transform="rotate(20)"/>
    <ellipse rx="110" ry="40" fill="none" stroke="#4CC9F0" stroke-width="1.2" opacity="0.5" transform="rotate(0)"/>
    <circle cx="0" cy="0" r="20" fill="#0B1220" stroke="#4CC9F0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#4CC9F0"/>
    <circle cx="110" cy="0" r="5" fill="#7BE3FF" filter="url(#soft)"/>
    <circle cx="-110" cy="0" r="5" fill="#7BE3FF"/>
    <circle cx="95" cy="-38" r="4" fill="#7BE3FF"/>
    <circle cx="-95" cy="-38" r="4" fill="#7BE3FF"/>
    <circle cx="95" cy="38" r="4" fill="#7BE3FF"/>
    <circle cx="-95" cy="38" r="4" fill="#7BE3FF"/>
  </g>
  <text x="260" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#4CC9F0">REACT</text>
  <text x="260" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#64748B">COMPONENT ORBIT</text>

  <!-- Next.js dark glass tower -->
  <g>
    <rect x="420" y="120" width="110" height="220" fill="url(#darkTower)" stroke="#2A3A55" stroke-width="1.5"/>
    <line x1="448" y1="120" x2="448" y2="340" stroke="#141A28" stroke-width="1"/>
    <line x1="476" y1="120" x2="476" y2="340" stroke="#141A28" stroke-width="1"/>
    <line x1="504" y1="120" x2="504" y2="340" stroke="#141A28" stroke-width="1"/>
    <g fill="#2A3A55">
      <rect x="426" y="140" width="8" height="5"/><rect x="444" y="140" width="8" height="5"/><rect x="470" y="140" width="8" height="5"/><rect x="496" y="140" width="8" height="5"/><rect x="514" y="140" width="8" height="5"/>
      <rect x="426" y="180" width="8" height="5"/><rect x="444" y="180" width="8" height="5"/><rect x="470" y="180" width="8" height="5"/><rect x="496" y="180" width="8" height="5"/><rect x="514" y="180" width="8" height="5"/>
    </g>
    <text x="475" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#FFFFFF" font-weight="700">NEXT.JS</text>
    <rect x="455" y="352" width="40" height="6" fill="#4CC9F0" opacity="0.8"/>
  </g>

  <!-- TypeScript blue data node -->
  <g transform="translate(700,230)">
    <circle cx="0" cy="0" r="54" fill="#0B1220" stroke="#4CC9F0" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="44" fill="#0A1626" stroke="#4CC9F0" stroke-width="0.8" opacity="0.7"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#4CC9F0">TS</text>
    <circle cx="54" cy="0" r="4" fill="#7BE3FF"/><circle cx="-54" cy="0" r="4" fill="#7BE3FF"/>
    <circle cx="0" cy="-54" r="4" fill="#7BE3FF"/><circle cx="0" cy="54" r="4" fill="#7BE3FF"/>
  </g>
  <text x="700" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#4CC9F0">TYPESCRIPT</text>
  <text x="700" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#64748B">TYPED DATA NODE</text>

  <!-- Tailwind flowing grid -->
  <g transform="translate(960,230)">
    <rect x="-90" y="-90" width="180" height="180" fill="#0B1220" stroke="#22D3EE" stroke-width="1" opacity="0.9"/>
    <g stroke="#22D3EE" stroke-width="0.8" opacity="0.5">
      <line x1="-90" y1="-30" x2="90" y2="-30"/><line x1="-90" y1="30" x2="90" y2="30"/>
      <line x1="-30" y1="-90" x2="-30" y2="90"/><line x1="30" y1="-90" x2="30" y2="90"/>
    </g>
    <path d="M -90 -90 L 90 90" stroke="#22D3EE" stroke-width="1.2" opacity="0.8"/>
    <path d="M -90 90 L 90 -90" stroke="#22D3EE" stroke-width="1.2" opacity="0.8"/>
    <circle cx="-45" cy="-45" r="4" fill="#22D3EE"/><circle cx="45" cy="45" r="4" fill="#22D3EE"/>
    <circle cx="45" cy="-45" r="4" fill="#22D3EE"/><circle cx="-45" cy="45" r="4" fill="#22D3EE"/>
  </g>
  <text x="960" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#22D3EE">TAILWIND</text>
  <text x="960" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#64748B">UTILITY GRID</text>

  <text x="600" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="url(#titleGrad)">WEB DISTRICT</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#64748B">INTERFACE TOWERS</text>
</svg>