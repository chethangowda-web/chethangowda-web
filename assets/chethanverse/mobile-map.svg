<svg viewBox="0 0 560 1160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03050A"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="560" height="1160" fill="url(#bg)"/>

  <!-- vertical journey road -->
  <line x1="280" y1="120" x2="280" y2="1080" stroke="#141F38" stroke-width="2"/>
  <line x1="280" y1="120" x2="280" y2="1080" stroke="#4CC9F0" stroke-width="1" opacity="0.4"/>

  <!-- title -->
  <text x="280" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="6" fill="#FFFFFF">CHETHANVERSE</text>
  <text x="280" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="4" fill="#64748B">THE JOURNEY</text>

  <!-- station node helper -->
  <!-- ENTER -->
  <g>
    <circle cx="280" cy="150" r="16" fill="#0B1220" stroke="#4CC9F0" stroke-width="2"/>
    <text x="280" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4CC9F0">↓</text>
    <rect x="120" y="176" width="320" height="36" rx="18" fill="#0B1220" stroke="#4CC9F0" stroke-width="1.5"/>
    <text x="280" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#A9E7FF" font-weight="700">ENTER THE CITY</text>
  </g>

  <g>
    <circle cx="280" cy="240" r="6" fill="#4CC9F0"/>
    <circle cx="280" cy="282" r="6" fill="#4CC9F0"/>
  </g>

  <!-- CORE -->
  <g>
    <rect x="120" y="296" width="320" height="40" rx="8" fill="#0E1B31" stroke="#4CC9F0" stroke-width="1.5"/>
    <text x="280" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3" fill="#FFFFFF" font-weight="800">CHETHAN CORE</text>
    <text x="280" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2" fill="#64748B">FULL-STACK · AI · BACKEND · SYSTEMS</text>
  </g>

  <g><circle cx="280" cy="370" r="6" fill="#7B61FF"/><circle cx="280" cy="400" r="6" fill="#7B61FF"/></g>

  <!-- WEB -->
  <g>
    <rect x="100" y="414" width="360" height="40" rx="8" fill="#081522" stroke="#4CC9F0" stroke-width="1.5"/>
    <text x="280" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#A9E7FF" font-weight="700">WEB DISTRICT</text>
    <text x="280" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5" fill="#64748B">REACT · NEXT.JS · TS · TAILWIND</text>
  </g>

  <g><circle cx="280" cy="490" r="6" fill="#4CC9F0"/></g>

  <!-- BACKEND -->
  <g>
    <rect x="100" y="504" width="360" height="40" rx="8" fill="#0E0D24" stroke="#7B61FF" stroke-width="1.5"/>
    <text x="280" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#C9BFFF" font-weight="700">BACKEND DISTRICT</text>
    <text x="280" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5" fill="#64748B">NODE.JS · EXPRESS · FASTAPI</text>
  </g>

  <g><circle cx="280" cy="580" r="6" fill="#7B61FF"/><circle cx="280" cy="608" r="6" fill="#7B61FF"/></g>

  <!-- DATA -->
  <g>
    <rect x="100" y="622" width="360" height="40" rx="8" fill="#04150F" stroke="#00D4A8" stroke-width="1.5"/>
    <text x="280" y="648" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#7CFFDD" font-weight="700">DATA DISTRICT</text>
    <text x="280" y="678" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5" fill="#64748B">POSTGRESQL · MONGODB · MYSQL · REDIS</text>
  </g>

  <g><circle cx="280" cy="698" r="6" fill="#00D4A8"/><circle cx="280" cy="726" r="6" fill="#00D4A8"/></g>

  <!-- AI -->
  <g>
    <rect x="80" y="740" width="400" height="40" rx="8" fill="#0E0820" stroke="#B967FF" stroke-width="1.5"/>
    <text x="280" y="766" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#E3C2FF" font-weight="700">AI RESEARCH DISTRICT</text>
    <text x="280" y="796" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5" fill="#64748B">LLMs · RAG · AGENTS · MULTI-AGENT</text>
    <text x="280" y="812" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="2" fill="#B967FF">+ AGENT LAB — MCP · A2A · ADK · MASTRA</text>
  </g>

  <g><circle cx="280" cy="832" r="6" fill="#B967FF"/><circle cx="280" cy="860" r="6" fill="#B967FF"/></g>

  <!-- PROJECTS -->
  <g>
    <rect x="80" y="874" width="400" height="40" rx="8" fill="#0A1522" stroke="#4CC9F0" stroke-width="1.5"/>
    <text x="280" y="900" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#A9E7FF" font-weight="700">PROJECT DISTRICT</text>
    <text x="280" y="930" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5" fill="#64748B">SARA · SENTINELFLOW · MEDFLOW · SPENDWISE</text>
  </g>

  <g><circle cx="280" cy="950" r="6" fill="#4CC9F0"/><circle cx="280" cy="978" r="6" fill="#4CC9F0"/></g>

  <!-- ARCHIVE -->
  <g>
    <rect x="120" y="992" width="320" height="36" rx="8" fill="#0B1220" stroke="#4CC9F0" stroke-width="1.5"/>
    <text x="280" y="1016" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#A9E7FF" font-weight="700">THE ARCHIVE</text>
  </g>

  <g><circle cx="280" cy="1044" r="6" fill="#4CC9F0"/><circle cx="280" cy="1070" r="6" fill="#7B61FF"/></g>

  <!-- HORIZON -->
  <g>
    <ellipse cx="280" cy="1102" rx="130" ry="20" fill="#7B61FF" opacity="0.25" filter="url(#glow)"/>
    <rect x="100" y="1084" width="360" height="36" rx="18" fill="#0A0620" stroke="#7B61FF" stroke-width="1.5"/>
    <text x="280" y="1108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#C9BFFF" font-weight="700">NEXT HORIZON → SDE</text>
  </g>
</svg>