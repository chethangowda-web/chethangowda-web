<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9D3E0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1A1E26" stroke-width="1"/>
    </pattern>
    <filter id="blurSoft"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="blurGlow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="420" fill="#050505"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="420" fill="url(#glowViolet)"/>
  <circle cx="980" cy="90" r="260" fill="url(#glowCyan)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#242832" rx="18"/>

  <!-- ambient node network, left -->
  <g stroke="#2A3140" stroke-width="1" opacity="0.9">
    <path d="M60 80 L 190 130 L 150 230 L 260 260" fill="none"/>
    <path d="M190 130 L 300 90" fill="none"/>
    <path d="M260 260 L 340 320" fill="none"/>
  </g>
  <g fill="#3B82F6">
    <circle cx="60" cy="80" r="3"/>
    <circle cx="190" cy="130" r="4"/>
    <circle cx="300" cy="90" r="3"/>
    <circle cx="150" cy="230" r="3"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="260" cy="260" r="4"/>
    <circle cx="340" cy="320" r="3"/>
  </g>

  <!-- ambient node network, right -->
  <g stroke="#2A3140" stroke-width="1" opacity="0.9">
    <path d="M1140 60 L 1030 110 L 1080 200 L 990 250" fill="none"/>
    <path d="M1030 110 L 950 70" fill="none"/>
    <path d="M1080 200 L 1150 260" fill="none"/>
  </g>
  <g fill="#8B5CF6">
    <circle cx="1140" cy="60" r="3"/>
    <circle cx="1030" cy="110" r="4"/>
    <circle cx="950" cy="70" r="3"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="1080" cy="200" r="4"/>
    <circle cx="990" cy="250" r="3"/>
    <circle cx="1150" cy="260" r="3"/>
  </g>

  <!-- connecting arc through center -->
  <path d="M 40 200 C 300 60, 900 60, 1160 200" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.55"/>

  <!-- eyebrow -->
  <text x="600" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="6" fill="#8B93A1">ENGINEERING LAB / 2026</text>

  <!-- main title -->
  <text x="600" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="2" fill="url(#textGrad)">CHETHAN GOWDA</text>

  <!-- subtitle -->
  <text x="600" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4" fill="#3B82F6" font-weight="700">FULL-STACK DEVELOPER  ×  AI ENGINEER</text>

  <!-- supporting line -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" letter-spacing="2" fill="#8B93A1">Computer Science student building intelligent, full-stack systems</text>

  <!-- status row -->
  <circle cx="66" cy="368" r="4" fill="#22D3EE" filter="url(#blurSoft)"/>
  <circle cx="66" cy="368" r="4" fill="#22D3EE"/>
  <text x="80" y="373" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#C9D3E0">ONLINE — OPEN TO INTERNSHIPS 2026</text>

  <text x="1134" y="373" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#8B93A1">BENGALURU, IN</text>

  <line x1="40" y1="345" x2="1160" y2="345" stroke="#1A1E26" stroke-width="1"/>
</svg>
