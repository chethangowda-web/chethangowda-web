<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="gridCb" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#12151B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" fill="#050505"/>
  <rect width="1200" height="260" fill="url(#gridCb)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#242832" rx="16"/>

  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="5" fill="#8B93A1">CURRENTLY BUILDING</text>
